<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#080808">
    
    <link rel="apple-touch-icon" href="https://uploads.zero-two-apis.com.br/uploads/images/f00052c7c2ba549349ac9d839dbe4a28a521e8ea2d244d05e857aa2d103d519f.jpg">

    <title>REDPLAY Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.youtube.com/iframe_api"></script>
    
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { background-color: #080808; color: white; font-family: sans-serif; overflow-x: hidden; overscroll-behavior-y: contain; }
        .redplay-logo { background: linear-gradient(135deg, #ff0000, #990000); width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
        .cat-avatar { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #ff0000; background-size: cover; background-position: center; cursor: pointer; }
        #playerContainer { transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); z-index: 5000; }
        .full-player { position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: black; }
        .mini-player { position: fixed !important; bottom: 20px; left: 20px; width: 300px !important; height: 170px !important; border-radius: 12px; border: 2px solid #ff0000; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
        @media (max-width: 640px) { .mini-player { bottom: 0; left: 0; width: 100% !important; height: 80px !important; border-radius: 0; border: none; border-top: 2px solid #ff0000; } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="antialiased">

    <nav class="fixed top-0 w-full bg-[#080808]/90 backdrop-blur-md z-[3000] flex items-center justify-between px-4 h-16 border-b border-zinc-900">
        <div class="flex items-center gap-2 cursor-pointer" onclick="location.reload()">
            <div class="redplay-logo"><i class="fa-solid fa-play text-white text-xs"></i></div>
            <span class="text-xl font-black uppercase tracking-tighter">RedPlay</span>
        </div>
        
        <div class="flex-1 max-w-[400px] mx-4">
            <div class="flex bg-zinc-900 border border-zinc-800 rounded-full px-4 py-1.5 focus-within:border-red-600">
                <input id="searchInput" type="text" placeholder="Pesquisar..." class="bg-transparent w-full outline-none text-sm text-white">
                <button id="searchBtn" class="ml-2 text-zinc-400"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
        </div>
        <div id="avatar" class="cat-avatar"></div>
    </nav>

    <main class="pt-24 pb-10 p-4 lg:p-8 max-w-[2000px] mx-auto">
        <div id="historySection" class="hidden mb-10">
            <h2 class="text-xs font-bold text-red-500 mb-4 uppercase tracking-widest">Continuar assistindo</h2>
            <div id="historyGrid" class="flex gap-4 overflow-x-auto no-scrollbar pb-2"></div>
        </div>

        <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-6 gap-x-4 gap-y-10"></div>
        
        <div id="loaderScroll" class="py-20 text-center">
            <div class="inline-block w-8 h-8 border-2 border-t-red-600 border-zinc-800 rounded-full animate-spin"></div>
        </div>
    </main>

    <div id="playerWrapper" class="hidden">
        <div id="playerContainer" class="full-player">
            <div class="absolute top-5 left-5 z-[6000] flex gap-3">
                <button onclick="closePlayer()" class="w-12 h-12 bg-black/60 rounded-full text-red-500 border border-white/10 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
                <button onclick="togglePlayerMode()" class="w-12 h-12 bg-black/60 rounded-full text-white border border-white/10 flex items-center justify-center"><i class="fa-solid fa-compress"></i></button>
            </div>
            <div id="ytPlayer"></div>
        </div>
    </div>

    <script>
        document.getElementById('avatar').style.backgroundImage = `url('https://cataas.com/cat?width=100&t=${Math.random()}')`;

        let player, videoPool = [], history = JSON.parse(localStorage.getItem('rp_history')) || [], isLoading = false, currentQuery = "Destaques";
        const temasIniciais = ["Música 2025", "Tecnologia", "Gaming 4K", "Trailers de Filmes", "Documentários Ciência"];

        function onYouTubeIframeAPIReady() { renderHistory(); realizarPesquisa("Destaques", true); }

        async function realizarPesquisa(query, limpar = true) {
            if (isLoading) return;
            isLoading = true;
            
            const grid = document.getElementById('videoGrid');
            const histSection = document.getElementById('historySection');
            
            if(limpar) { 
                grid.innerHTML = ""; 
                videoPool = []; 
                window.scrollTo(0,0);
                currentQuery = query;
                histSection.className = (query === "Destaques" && history.length > 0) ? "mb-10" : "hidden";
            }

            try {
                // Se estivermos no modo infinito da Home, pegamos um tema aleatório
                const searchQuery = (query === "Destaques" && !limpar) ? temasIniciais[Math.floor(Math.random()*temasIniciais.length)] : query;
                
                const response = await fetch(`https://corsproxy.io/?${encodeURIComponent('https://kuromi-system-tech.onrender.com/api/pesquisayt?query='+searchQuery)}`);
                const data = await response.json();
                
                if (data.formattedVideos && data.formattedVideos.length > 0) {
                    data.formattedVideos.forEach(v => {
                        const id = v.link.split('v=')[1];
                        if(!videoPool.includes(id)) {
                            videoPool.push(id);
                            grid.insertAdjacentHTML('beforeend', `
                                <div class="cursor-pointer group animate-in fade-in duration-500" onclick="saveAndPlay('${id}', '${v.title.replace(/'/g,"")}', '${v.thumbnail}', '${v.channel}')">
                                    <div class="relative aspect-video rounded-xl overflow-hidden bg-zinc-900 mb-3 border border-zinc-800">
                                        <img src="${v.thumbnail}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                                        <span class="absolute bottom-2 right-2 bg-black/90 px-2 py-0.5 rounded text-[10px] font-bold text-red-500">${v.duration}</span>
                                    </div>
                                    <h3 class="font-bold text-sm line-clamp-2 leading-tight">${v.title}</h3>
                                    <p class="text-zinc-500 text-xs mt-1">${v.channel}</p>
                                </div>`);
                        }
                    });
                }
            } catch(e) { console.error(e); }
            finally { isLoading = false; }
        }

        // LÓGICA DE SCROLL INFINITO RECURSIVA
        window.onscroll = () => {
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 1200) {
                if (!isLoading) {
                    realizarPesquisa(currentQuery, false);
                }
            }
        };

        function saveAndPlay(id, title, thumb, channel) {
            history = history.filter(i => i.id !== id);
            history.unshift({id, title, thumbnail: thumb, channel});
            localStorage.setItem('rp_history', JSON.stringify(history.slice(0, 15)));
            if(currentQuery === "Destaques") renderHistory();
            openPlayer(id);
        }

        function renderHistory() {
            const grid = document.getElementById('historyGrid');
            grid.innerHTML = history.map(v => `<div class="min-w-[180px] cursor-pointer" onclick="openPlayer('${v.id}')"><div class="relative aspect-video rounded-xl overflow-hidden mb-1 border border-zinc-800"><img src="${v.thumbnail}" class="w-full h-full object-cover"></div><h4 class="text-[10px] font-medium line-clamp-1 text-zinc-400">${v.title}</h4></div>`).join('');
        }

        function openPlayer(id) {
            document.getElementById('playerWrapper').classList.remove('hidden');
            if (player) player.loadVideoById(id);
            else player = new YT.Player('ytPlayer', { height:'100%', width:'100%', videoId:id, playerVars:{'autoplay':1}, events:{'onStateChange':(e)=>e.data===0 && playNext()} });
            setFull();
        }

        function togglePlayerMode() { document.getElementById('playerContainer').className = document.getElementById('playerContainer').className.includes('full-player') ? "mini-player" : "full-player"; }
        function setFull() { document.getElementById('playerContainer').className = "full-player"; document.body.style.overflow = 'hidden'; }
        function closePlayer() { player.stopVideo(); document.getElementById('playerWrapper').classList.add('hidden'); document.body.style.overflow = 'auto'; }
        function playNext() { player.loadVideoById(videoPool[Math.floor(Math.random()*videoPool.length)]); }

        document.getElementById('searchBtn').onclick = () => realizarPesquisa(document.getElementById('searchInput').value, true);
        document.getElementById('searchInput').onkeypress = (e) => e.key === 'Enter' && realizarPesquisa(e.target.value, true);
    </script>
</body>
</html>
