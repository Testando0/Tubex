<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Clone Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f0f0f; color: white; scroll-behavior: smooth; }
        .yt-red { color: #ff0000; }
        .video-card:hover .thumbnail { transform: scale(1.03); }
        .video-card img { transition: transform 0.3s ease; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        /* Estilo para o Player em Tela Cheia (Overlay) */
        #videoOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: black; z-index: 9999;
        }
    </style>
</head>
<body class="antialiased">

    <nav class="fixed top-0 w-full bg-[#0f0f0f] z-50 flex items-center justify-between px-4 h-14 border-b border-zinc-800">
        <div class="flex items-center gap-4">
            <i class="fa-solid fa-bars text-xl p-2 cursor-pointer hover:bg-zinc-800 rounded-full"></i>
            <div class="flex items-center gap-1 cursor-pointer" onclick="location.reload()">
                <i class="fa-brands fa-youtube text-3xl yt-red"></i>
                <span class="text-xl font-bold tracking-tighter">YouTube</span>
            </div>
        </div>

        <div class="flex items-center flex-1 max-w-[720px] mx-10">
            <div class="flex w-full bg-zinc-900 border border-zinc-800 rounded-full items-center px-4 py-1.5 focus-within:border-blue-500 transition-all">
                <input id="searchInput" type="text" placeholder="Pesquisar" class="bg-transparent w-full outline-none text-zinc-200">
                <button id="searchBtn" class="pl-4 text-zinc-400 hover:text-white border-l border-zinc-700 ml-2">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>
        </div>

        <div class="flex items-center gap-4 px-2">
            <div class="w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center font-bold">R</div>
        </div>
    </nav>

    <aside class="hidden lg:block w-60 fixed left-0 pt-16 h-screen p-3 space-y-1">
        <div class="flex items-center gap-5 p-3 rounded-xl bg-zinc-800 cursor-pointer">
            <i class="fa-solid fa-house"></i> <span class="text-sm font-medium">Início</span>
        </div>
        <div class="flex items-center gap-5 p-3 rounded-xl hover:bg-zinc-800 cursor-pointer text-zinc-400">
            <i class="fa-solid fa-bolt"></i> <span class="text-sm font-medium">Shorts</span>
        </div>
        <div class="flex items-center gap-5 p-3 rounded-xl hover:bg-zinc-800 cursor-pointer text-zinc-400 border-b border-zinc-800 pb-4">
            <i class="fa-solid fa-clapperboard"></i> <span class="text-sm font-medium">Inscrições</span>
        </div>
    </aside>

    <main class="lg:ml-60 pt-20 p-4 lg:p-8">
        
        <div id="loader" class="hidden text-center py-20">
            <div class="inline-block w-10 h-10 border-4 border-zinc-700 border-t-red-600 rounded-full animate-spin"></div>
            <p class="mt-4 text-zinc-400 animate-pulse">Buscando vídeos...</p>
        </div>

        <div id="videoGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-x-4 gap-y-10">
            </div>
    </main>

    <div id="videoOverlay">
        <button onclick="closePlayer()" class="absolute top-4 right-4 z-[10000] bg-white/10 hover:bg-white/20 p-3 rounded-full text-white transition-all">
            <i class="fa-solid fa-xmark text-2xl"></i>
        </button>
        <iframe id="fullPlayer" class="w-full h-full" src="" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const loader = document.getElementById('loader');
        const grid = document.getElementById('videoGrid');
        const overlay = document.getElementById('videoOverlay');
        const fullPlayer = document.getElementById('fullPlayer');

        async function realizarBusca() {
            const query = searchInput.value.trim();
            if (!query) return;

            grid.innerHTML = "";
            loader.classList.remove('hidden');

            try {
                // Nova API com Proxy para evitar CORS
                const targetUrl = `https://kuromi-system-tech.onrender.com/api/pesquisayt?query=${encodeURIComponent(query)}`;
                const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;

                const response = await fetch(proxyUrl);
                const data = await response.json();

                if (data.formattedVideos && data.formattedVideos.length > 0) {
                    data.formattedVideos.forEach(video => {
                        renderizarVideo(video);
                    });
                } else {
                    alert("Nenhum vídeo encontrado.");
                }
            } catch (error) {
                console.error("Erro na API:", error);
                alert("Erro ao conectar com o sistema de busca.");
            } finally {
                loader.classList.add('hidden');
            }
        }

        function renderizarVideo(video) {
            // Extrair ID do link para o embed
            const videoId = video.link.split('v=')[1];

            const card = `
                <div class="video-card cursor-pointer group" onclick="openPlayer('${videoId}')">
                    <div class="relative aspect-video rounded-xl overflow-hidden bg-zinc-800 mb-3 thumbnail">
                        <img src="${video.thumbnail}" class="w-full h-full object-cover">
                        <span class="absolute bottom-2 right-2 bg-black/80 px-1.5 py-0.5 rounded text-xs font-medium">
                            ${video.duration}
                        </span>
                    </div>
                    
                    <div class="flex gap-3">
                        <div class="w-9 h-9 bg-zinc-800 rounded-full flex-shrink-0 flex items-center justify-center font-bold text-xs text-zinc-500">
                            ${video.channel.charAt(0)}
                        </div>
                        <div class="flex flex-col">
                            <h3 class="font-bold text-sm leading-tight line-clamp-2 group-hover:text-zinc-300">
                                ${video.title}
                            </h3>
                            <p class="text-zinc-400 text-xs mt-1.5 hover:text-white transition-colors">
                                ${video.channel}
                            </p>
                            <p class="text-zinc-400 text-[11px]">
                                ${formatarViews(video.views)} • Há algum tempo
                            </p>
                        </div>
                    </div>
                </div>
            `;
            grid.insertAdjacentHTML('beforeend', card);
        }

        function formatarViews(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + ' mi de visualizações';
            if (num >= 1000) return (num / 1000).toFixed(0) + ' mil visualizações';
            return num + ' visualizações';
        }

        // Funções do Player
        function openPlayer(id) {
            fullPlayer.src = `https://www.youtube.com/embed/${id}?autoplay=1&rel=0`;
            overlay.style.display = 'block';
            document.body.style.overflow = 'hidden'; // Impede scroll
        }

        function closePlayer() {
            fullPlayer.src = "";
            overlay.style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        // Eventos
        searchBtn.addEventListener('click', realizarBusca);
        searchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') realizarBusca(); });
    </script>
</body>
</html>
