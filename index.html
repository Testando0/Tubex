<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#080808">
    <link rel="manifest" href='data:application/manifest+json,{"name":"RedPlay","short_name":"RedPlay","display":"standalone","background_color":"#080808"}'>

    <title>REDPLAY Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.youtube.com/iframe_api"></script>
    
    <style>
        /* COMPORTAMENTO NATIVO */
        * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; }
        input { user-select: auto !important; }
        
        body { 
            background-color: #080808; color: white; font-family: sans-serif; 
            margin: 0; padding-top: env(safe-area-inset-top); 
            overscroll-behavior-y: contain; 
        }

        .redplay-logo { background: linear-gradient(135deg, #ff0000, #990000); width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .cat-avatar { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #ff0000; background-size: cover; background-position: center; }
        
        /* PLAYER WRAPPER */
        #playerWrapper { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 5000; display: none; background: black; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* CONTROLES DO PLAYER */
        .player-controls { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            display: flex; align-items: center; justify-content: center; 
            gap: 20px; z-index: 5500; background: rgba(0,0,0,0.6); 
            opacity: 0; transition: opacity 0.3s; pointer-events: none; 
        }
        .player-controls.active { opacity: 1; pointer-events: auto; }
        .control-btn { width: 60px; height: 60px; border-radius: 50%; background: rgba(255,255,255,0.1); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; font-size: 24px; border: 1px solid rgba(255,255,255,0.1); color: white; }
    </style>
</head>
<body>

    <nav class="fixed top-0 w-full bg-[#080808]/90 backdrop-blur-md z-[3000] flex items-center justify-between px-4 h-20 border-b border-zinc-900">
        <div class="flex items-center gap-2" onclick="voltarHome()">
            <div class="redplay-logo"><i class="fa-solid fa-play text-white text-xs"></i></div>
            <span class="text-xl font-black uppercase tracking-tighter">RedPlay</span>
        </div>
        <div class="flex-1 max-w-[400px] mx-4">
            <div class="flex bg-zinc-900 border border-zinc-800 rounded-full px-4 py-2 focus-within:border-red-600">
                <input id="searchInput" type="text" placeholder="Pesquisar..." class="bg-transparent w-full outline-none text-sm text-white">
                <button id="searchBtn" class="ml-2 text-zinc-400"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
        </div>
        <div id="avatar" class="cat-avatar"></div>
    </nav>

    <main class="pt-28 pb-10 p-4 lg:p-8 max-w-[2000px] mx-auto">
        
        <div id="historySection" class="hidden mb-10">
            <h2 class="text-xs font-bold text-red-500 mb-4 uppercase tracking-widest">Assistidos recentemente</h2>
            <div id="historyGrid" class="flex gap-4 overflow-x-auto no-scrollbar pb-2"></div>
        </div>

        <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-6 gap-x-4 gap-y-10"></div>
        
        <div id="loaderScroll" class="py-10 text-center opacity-0 transition-opacity">
            <div class="inline-block w-8 h-8 border-2 border-t-red-600 border-zinc-800 rounded-full animate-spin"></div>
        </div>
    </main>

    <div id="playerWrapper">
        <div class="relative w-full h-full" onclick="toggleControls()">
            <div class="absolute top-10 left-5 z-[6000]">
                <button onclick="closePlayer()" class="w-12 h-12 bg-black/60 rounded-full text-red-500 flex items-center justify-center border border-white/10"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="player-controls" id="customControls">
                <button onclick="event.stopPropagation(); seekVideo(-10)" class="control-btn"><i class="fa-solid fa-rotate-left"></i></button>
                <button onclick="event.stopPropagation(); playPrev()" class="control-btn"><i class="fa-solid fa-backward"></i></button>
                <button onclick="event.stopPropagation(); playNext()" class="control-btn"><i class="fa-solid fa-forward"></i></button>
                <button onclick="event.stopPropagation(); seekVideo(10)" class="control-btn"><i class="fa-solid fa-rotate-right"></i></button>
            </div>
            <div id="ytPlayer"></div>
        </div>
    </div>

    <script>
        // Init Avatar
        document.getElementById('avatar').style.backgroundImage = `url('https://cataas.com/cat?t=${Math.random()}')`;

        let player, videoPool = [], history = JSON.parse(localStorage.getItem('rp_history')) || [], isLoading = false;
        let currentIndex = -1, controlTimer, currentSearch = "Destaques", isHome = true;

        // Inicia API do YouTube
        function onYouTubeIframeAPIReady() {
            renderHistory();
            realizarPesquisa("Destaques", true);
        }

        // FUNÇÃO DE PESQUISA COM SKOOL INFINITO
        async function realizarPesquisa(query, limpar = true) {
            if (isLoading) return;
            isLoading = true;
            document.getElementById('loaderScroll').style.opacity = "1";

            if(limpar) {
                document.getElementById('videoGrid').innerHTML = "";
                videoPool = [];
                currentSearch = query;
                if(query !== "Destaques") {
                    document.getElementById('historySection').classList.add('hidden');
                    isHome = false;
                }
            }

            try {
                const apiURL = `https://redzinapi-tech.onrender.com/youtube/search?query=${encodeURIComponent(query)}&apikey=REDZ`;
                const response = await fetch(`https://corsproxy.io/?${encodeURIComponent(apiURL)}`);
                const data = await response.json();

                if (data.status && data.resultado) {
                    data.resultado.forEach(v => {
                        if (v.type === 'video' && !videoPool.find(item => item.id === v.videoId)) {
                            addVideoToGrid(v);
                        }
                    });
                }
            } catch (error) { console.error("Erro na API"); }
            
            isLoading = false;
            document.getElementById('loaderScroll').style.opacity = "0";
        }

        function addVideoToGrid(v) {
            const videoData = { id: v.videoId, title: v.title, thumb: v.thumbnail || v.image, artist: v.author?.name || 'YouTube', duration: v.timestamp || "--:--" };
            videoPool.push(videoData);
            
            document.getElementById('videoGrid').insertAdjacentHTML('beforeend', `
                <div class="cursor-pointer group" onclick="saveAndPlay('${videoData.id}', \`${videoData.title.replace(/'/g, "")}\`, '${videoData.thumb}')">
                    <div class="relative aspect-video rounded-xl overflow-hidden bg-zinc-900 mb-3 border border-zinc-800">
                        <img src="${videoData.thumb}" class="w-full h-full object-cover">
                        <span class="absolute bottom-2 right-2 bg-black/90 px-2 py-0.5 rounded text-[10px] font-bold text-red-500">${videoData.duration}</span>
                    </div>
                    <h3 class="font-bold text-sm line-clamp-2">${videoData.title}</h3>
                    <p class="text-zinc-500 text-xs mt-1">${videoData.artist}</p>
                </div>`);
        }

        function saveAndPlay(id, title, thumb) {
            currentIndex = videoPool.findIndex(v => v.id === id);
            history = history.filter(v => v.id !== id);
            history.unshift({id, title, thumb});
            localStorage.setItem('rp_history', JSON.stringify(history.slice(0,12)));
            if(isHome) renderHistory();
            openPlayer(id);
        }

        function openPlayer(id) {
            document.getElementById('playerWrapper').style.display = 'block';
            if (player?.loadVideoById) {
                player.loadVideoById(id);
            } else {
                player = new YT.Player('ytPlayer', {
                    height:'100%', width:'100%', videoId: id,
                    playerVars: { 'autoplay': 1, 'playsinline': 1, 'modestbranding': 1 },
                    events: { 'onStateChange': (e) => { if(e.data === 0) playNext(); } }
                });
            }
            document.body.style.overflow = 'hidden';
        }

        function closePlayer() {
            if(player?.stopVideo) player.stopVideo();
            document.getElementById('playerWrapper').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        function voltarHome() {
            document.getElementById('searchInput').value = "";
            isHome = true;
            renderHistory();
            realizarPesquisa("Destaques", true);
        }

        function renderHistory() {
            const section = document.getElementById('historySection');
            if(history.length > 0 && isHome) {
                section.classList.remove('hidden');
                document.getElementById('historyGrid').innerHTML = history.map(v => `
                    <div class="min-w-[120px] max-w-[120px] cursor-pointer" onclick="openPlayer('${v.id}')">
                        <img src="${v.thumb}" class="w-full aspect-square object-cover rounded-xl border border-zinc-800">
                        <p class="text-[10px] mt-1 line-clamp-1">${v.title}</p>
                    </div>
                `).join('');
            } else { section.classList.add('hidden'); }
        }

        function toggleControls() {
            const c = document.getElementById('customControls');
            c.classList.toggle('active');
            clearTimeout(controlTimer);
            if(c.classList.contains('active')) controlTimer = setTimeout(() => c.classList.remove('active'), 3000);
        }

        function seekVideo(sec) { if(player) player.seekTo(player.getCurrentTime() + sec, true); }
        function playNext() { if(currentIndex < videoPool.length - 1) { currentIndex++; openPlayer(videoPool[currentIndex].id); } }
        function playPrev() { if(currentIndex > 0) { currentIndex--; openPlayer(videoPool[currentIndex].id); } }

        // INPUT EVENTS
        document.getElementById('searchBtn').onclick = () => realizarPesquisa(document.getElementById('searchInput').value, true);
        document.getElementById('searchInput').onkeypress = (e) => { if(e.key === 'Enter') realizarPesquisa(e.target.value, true); };

        // SCROLL INFINITO (SKOOL)
        window.onscroll = () => {
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 900 && !isLoading) {
                realizarPesquisa(currentSearch, false);
            }
        };
    </script>
</body>
</html>
