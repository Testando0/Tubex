<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>REDPLAY - Vídeos Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        body { background-color: #080808; color: white; -webkit-tap-highlight-color: transparent; }
        .redplay-icon { background: #ff0000; width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px rgba(255,0,0,0.4); }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .chip { padding: 6px 14px; background: #1a1a1a; border-radius: 20px; font-size: 13px; white-space: nowrap; cursor: pointer; border: 1px solid #333; }
        .chip.active { background: #ff0000; border-color: #ff0000; }
        
        /* PLAYER CONTAINER */
        #playerContainer { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 5000; }
        .full-player { position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: black; }
        
        /* MINI PLAYER AJUSTADO */
        .mini-player { position: fixed !important; bottom: 20px; left: 20px; /* MOVIDO PARA ESQUERDA */
            width: 320px !important; height: 180px !important; border-radius: 12px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.9); border: 2px solid #ff0000; overflow: hidden; }

        /* CONTROLES DO PLAYER (MOVIDOS PARA A ESQUERDA) */
        .player-controls { position: absolute; top: 15px; left: 15px; /* LADO ESQUERDO PARA NÃO TAPAR LEGENDAS */
            z-index: 6000; display: flex; gap: 10px; pointer-events: auto; }
        
        .ctrl-btn { background: rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.1); 
            backdrop-filter: blur(5px); padding: 10px; rounded-full; width: 45px; height: 45px;
            display: flex; align-items: center; justify-content: center; border-radius: 50%; }

        @media (max-width: 640px) {
            .mini-player { bottom: 0; left: 0; width: 100% !important; height: 90px !important; border-radius: 0; border: none; border-top: 2px solid #ff0000; }
            .mini-player #ytPlayer { width: 150px !important; }
        }
    </style>
</head>
<body class="antialiased">

    <nav class="fixed top-0 w-full bg-[#080808]/95 backdrop-blur-md z-[3000] flex items-center justify-between px-4 h-16 border-b border-zinc-800">
        <div class="flex items-center gap-3 cursor-pointer" onclick="location.reload()">
            <div class="redplay-icon"><i class="fa-solid fa-play text-white text-xs"></i></div>
            <span class="text-xl font-black tracking-tight">REDPLAY</span>
        </div>

        <div class="flex-1 max-w-[450px] mx-4">
            <div class="flex bg-zinc-900/50 border border-zinc-700 rounded-lg items-center px-4 py-2 focus-within:border-red-600 transition-all">
                <input id="searchInput" type="text" placeholder="O que vamos assistir?" class="bg-transparent w-full outline-none text-sm">
                <button id="searchBtn" class="ml-2 text-zinc-400 hover:text-red-500"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
        </div>
        <div class="w-8 h-8 bg-red-600 rounded-full flex items-center justify-center font-bold text-xs">R</div>
    </nav>

    <div class="fixed top-16 w-full bg-[#080808] z-[2000] px-4 py-3 flex gap-3 overflow-x-auto border-b border-zinc-900 no-scrollbar">
        <div class="chip active" onclick="filtro('Destaques', this)">Início</div>
        <div class="chip" onclick="filtro('Música High Bass', this)">Música</div>
        <div class="chip" onclick="filtro('Games 4K', this)">Games</div>
        <div class="chip" onclick="filtro('Live Stream', this)">Ao Vivo</div>
        <button onclick="clearHistory()" class="ml-auto text-xs text-zinc-600">Limpar Vistos</button>
    </div>

    <main class="pt-36 pb-24 p-4 lg:p-10 max-w-[1920px] mx-auto">
        
        <div id="historySection" class="hidden mb-12 animate-in fade-in slide-in-from-left duration-500">
            <h2 class="text-sm font-bold uppercase tracking-widest text-zinc-500 mb-4">Continuar assistindo</h2>
            <div id="historyGrid" class="flex gap-4 overflow-x-auto pb-4 no-scrollbar"></div>
        </div>

        <h2 id="sectionTitle" class="text-xl font-bold mb-6">Recomendados para você</h2>
        <div id="loader" class="hidden mx-auto w-10 h-10 border-2 border-zinc-800 border-t-red-600 rounded-full animate-spin my-10"></div>
        <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-6 gap-x-4 gap-y-10"></div>
    </main>

    <div id="playerWrapper" class="hidden">
        <div id="playerContainer" class="full-player">
            <div class="player-controls">
                <button onclick="closePlayer()" class="ctrl-btn text-red-500 hover:scale-110 transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
                <button id="miniBtn" onclick="togglePlayerMode()" class="ctrl-btn text-white hover:scale-110 transition">
                    <i id="miniIcon" class="fa-solid fa-compress"></i>
                </button>
            </div>
            <div id="ytPlayer" class="w-full h-full"></div>
        </div>
    </div>

    <script>
        let player;
        let videoPool = [];
        let history = JSON.parse(localStorage.getItem('rp_history')) || [];

        function onYouTubeIframeAPIReady() {
            renderHistory();
            realizarPesquisa("Destaques");
        }

        async function realizarPesquisa(query) {
            const grid = document.getElementById('videoGrid');
            const loader = document.getElementById('loader');
            loader.classList.remove('hidden');
            if(query !== "Destaques") grid.innerHTML = "";

            try {
                const api = `https://kuromi-system-tech.onrender.com/api/pesquisayt?query=${encodeURIComponent(query)}`;
                const response = await fetch(`https://corsproxy.io/?${encodeURIComponent(api)}`);
                const data = await response.json();

                data.formattedVideos.forEach(v => {
                    const id = v.link.split('v=')[1];
                    if(!videoPool.includes(id)) videoPool.push(id);
                    grid.insertAdjacentHTML('beforeend', createCard(v, id, 'grid'));
                });
            } catch (e) { console.error(e); }
            finally { loader.classList.add('hidden'); }
        }

        function createCard(v, id, type) {
            const isH = type === 'history';
            return `
                <div class="${isH ? 'min-w-[220px]' : ''} cursor-pointer group" onclick="saveAndPlay('${id}', '${v.title.replace(/'/g,"")}', '${v.thumbnail}', '${v.channel}')">
                    <div class="relative aspect-video rounded-xl overflow-hidden bg-zinc-900 mb-3 border border-zinc-800">
                        <img src="${v.thumbnail}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                        <span class="absolute bottom-2 right-2 bg-black/90 px-2 py-0.5 rounded text-[10px] font-bold text-red-500 border border-red-500/30">${v.duration || '00:00'}</span>
                    </div>
                    <h3 class="font-bold text-sm line-clamp-2 group-hover:text-red-500 transition">${v.title}</h3>
                    <p class="text-zinc-500 text-xs mt-1 uppercase tracking-tighter">${v.channel}</p>
                </div>`;
        }

        function saveAndPlay(id, title, thumb, channel) {
            history = history.filter(i => i.id !== id);
            history.unshift({ id, title, thumbnail: thumb, channel });
            if(history.length > 12) history.pop();
            localStorage.setItem('rp_history', JSON.stringify(history));
            renderHistory();
            openPlayer(id);
        }

        function renderHistory() {
            const section = document.getElementById('historySection');
            const grid = document.getElementById('historyGrid');
            if(history.length > 0) {
                section.classList.remove('hidden');
                grid.innerHTML = history.map(v => createCard(v, v.id, 'history')).join('');
            } else { section.classList.add('hidden'); }
        }

        function openPlayer(id) {
            document.getElementById('playerWrapper').classList.remove('hidden');
            if (player) player.loadVideoById(id);
            else {
                player = new YT.Player('ytPlayer', {
                    height: '100%', width: '100%', videoId: id,
                    playerVars: { 'autoplay': 1, 'rel': 0, 'modestbranding': 1 },
                    events: { 'onStateChange': (e) => e.data === YT.PlayerState.ENDED && playNext() }
                });
            }
            setFull();
        }

        function playNext() {
            const next = videoPool[Math.floor(Math.random() * videoPool.length)];
            player.loadVideoById(next);
        }

        function togglePlayerMode() {
            const c = document.getElementById('playerContainer');
            if(c.classList.contains('mini-player')) setFull();
            else setMini();
        }

        function setMini() {
            const c = document.getElementById('playerContainer');
            c.className = "mini-player";
            document.getElementById('miniIcon').className = "fa-solid fa-expand";
            document.body.style.overflow = 'auto';
        }

        function setFull() {
            const c = document.getElementById('playerContainer');
            c.className = "full-player";
            document.getElementById('miniIcon').className = "fa-solid fa-compress";
            document.body.style.overflow = 'hidden';
        }

        function closePlayer() {
            player.stopVideo();
            document.getElementById('playerWrapper').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        function clearHistory() { history = []; localStorage.removeItem('rp_history'); renderHistory(); }
        function filtro(t, el) { 
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active'); 
            realizarPesquisa(t); 
        }

        document.getElementById('searchBtn').addEventListener('click', () => realizarPesquisa(document.getElementById('searchInput').value));
        document.getElementById('searchInput').addEventListener('keypress', (e) => e.key === 'Enter' && realizarPesquisa(e.target.value));
    </script>
</body>
</html>
