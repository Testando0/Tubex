<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="theme-color" content="#080808">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="REDPLAY">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/732/732257.png">
    
    <title>REDPLAY - Experience</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.youtube.com/iframe_api"></script>
    
    <style>
        body { background-color: #080808; color: white; -webkit-tap-highlight-color: transparent; overflow-x: hidden; font-family: 'Inter', sans-serif; }
        
        /* Ícone REDPLAY */
        .redplay-logo { background: linear-gradient(135deg, #ff0000, #b30000); width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(255,0,0,0.3); }

        /* Novo Perfil Premium (Substituindo a letra R) */
        .user-profile {
            width: 38px; height: 38px;
            border-radius: 50%;
            background: url('https://api.dicebear.com/7.x/avataaars/svg?seed=Felix') center/cover;
            border: 2px solid #ff0000;
            position: relative;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255,0,0,0.2);
        }
        .user-profile::after {
            content: ''; position: absolute; inset: -3px;
            border: 2px solid #ff0000; border-radius: 50%;
            animation: pulse 2s infinite; opacity: 0;
        }
        @keyframes pulse { 0% { transform: scale(1); opacity: 0.5; } 100% { transform: scale(1.4); opacity: 0; } }

        /* Estilos do Feed */
        .video-grid { display: grid; gap: 1.5rem 1rem; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Player e Controles */
        #playerContainer { transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); z-index: 5000; }
        .full-player { position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: black; }
        .mini-player { position: fixed !important; bottom: 25px; left: 20px; width: 340px !important; height: 190px !important; border-radius: 16px; border: 2px solid #ff0000; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.9); }
        .player-controls { position: absolute; top: 20px; left: 20px; z-index: 6000; display: flex; gap: 12px; }
        
        @media (max-width: 640px) {
            .mini-player { bottom: 0; left: 0; width: 100% !important; height: 100px !important; border-radius: 0; border: none; border-top: 2px solid #ff0000; }
        }
    </style>
</head>
<body class="antialiased">

    <nav class="fixed top-0 w-full bg-[#080808]/90 backdrop-blur-xl z-[3000] flex items-center justify-between px-5 h-16 border-b border-zinc-900">
        <div class="flex items-center gap-3 cursor-pointer" onclick="location.reload()">
            <div class="redplay-logo"><i class="fa-solid fa-play text-white text-sm"></i></div>
            <span class="text-xl font-black tracking-tighter uppercase">RedPlay</span>
        </div>
        
        <div class="flex-1 max-w-[400px] mx-4 hidden sm:block">
            <div class="flex bg-zinc-900/80 border border-zinc-800 rounded-full px-4 py-2 focus-within:border-red-600 transition-all">
                <input id="searchInput" type="text" placeholder="Buscar no app..." class="bg-transparent w-full outline-none text-sm">
                <i class="fa-solid fa-magnifying-glass text-zinc-500 text-sm"></i>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <i class="fa-solid fa-magnifying-glass sm:hidden text-lg"></i>
            <div class="user-profile"></div>
        </div>
    </nav>

    <main class="pt-24 pb-24 p-4 lg:p-8 max-w-[2400px] mx-auto">
        <div id="historySection" class="hidden mb-12">
            <h2 class="text-xs font-bold tracking-widest text-red-500 mb-4 uppercase flex items-center gap-2">
                <span class="w-1.5 h-1.5 bg-red-600 rounded-full animate-ping"></span> Continuar assistindo
            </h2>
            <div id="historyGrid" class="flex gap-4 overflow-x-auto pb-4 no-scrollbar"></div>
        </div>

        <div id="videoGrid" class="video-grid"></div>

        <div id="loaderScroll" class="py-20 text-center opacity-0 transition-opacity">
            <div class="inline-block w-8 h-8 border-2 border-t-red-600 border-zinc-800 rounded-full animate-spin"></div>
        </div>
    </main>

    <div id="playerWrapper" class="hidden">
        <div id="playerContainer" class="full-player">
            <div class="player-controls">
                <button onclick="closePlayer()" class="w-12 h-12 bg-black/70 backdrop-blur-md rounded-full flex items-center justify-center text-red-500 border border-white/10"><i class="fa-solid fa-xmark"></i></button>
                <button onclick="togglePlayerMode()" class="w-12 h-12 bg-black/70 backdrop-blur-md rounded-full flex items-center justify-center text-white border border-white/10"><i class="fa-solid fa-compress"></i></button>
            </div>
            <div id="ytPlayer"></div>
        </div>
    </div>

    <script>
        // Lógica PWA: Registra um Service Worker fictício para habilitar instalação
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => { /* Apenas para simular PWA */ });
            });
        }

        let player;
        let videoPool = [];
        let history = JSON.parse(localStorage.getItem('rp_history')) || [];
        let isLoading = false;
        const temas = ["New Music 2025", "Cinematic 4K", "Tech Reviews", "Live Concerts", "Gaming Highlights", "Nature 8K"];

        function onYouTubeIframeAPIReady() {
            renderHistory();
            initFeed();
        }

        async function initFeed() {
            for(let t of temas.slice(0,3)) await realizarPesquisa(t, false);
        }

        async function realizarPesquisa(query, limpar = true) {
            if (isLoading) return;
            isLoading = true;
            const grid = document.getElementById('videoGrid');
            const loader = document.getElementById('loaderScroll');
            if(limpar) { grid.innerHTML = ""; videoPool = []; window.scrollTo(0,0); }
            loader.style.opacity = "1";

            try {
                const api = `https://kuromi-system-tech.onrender.com/api/pesquisayt?query=${encodeURIComponent(query)}`;
                const response = await fetch(`https://corsproxy.io/?${encodeURIComponent(api)}`);
                const data = await response.json();

                data.formattedVideos.forEach(v => {
                    const id = v.link.split('v=')[1];
                    if(!videoPool.includes(id)) {
                        videoPool.push(id);
                        grid.insertAdjacentHTML('beforeend', `
                            <div class="cursor-pointer group animate-in zoom-in duration-500" onclick="saveAndPlay('${id}', '${v.title.replace(/'/g,"")}', '${v.thumbnail}', '${v.channel}')">
                                <div class="relative aspect-video rounded-2xl overflow-hidden bg-zinc-900 border border-zinc-800 shadow-lg group-hover:border-red-600/50 transition-all">
                                    <img src="${v.thumbnail}" class="w-full h-full object-cover group-hover:scale-105 transition duration-700" loading="lazy">
                                    <span class="absolute bottom-3 right-3 bg-black/90 px-2 py-0.5 rounded text-[10px] font-black text-red-500 border border-red-500/20">${v.duration}</span>
                                </div>
                                <div class="mt-3 flex gap-3">
                                    <div class="w-10 h-10 bg-gradient-to-tr from-zinc-800 to-zinc-700 rounded-full flex-shrink-0 flex items-center justify-center font-bold text-zinc-400">${v.channel[0]}</div>
                                    <div>
                                        <h3 class="font-bold text-sm line-clamp-2 leading-snug group-hover:text-red-500 transition">${v.title}</h3>
                                        <p class="text-zinc-500 text-xs mt-1 font-medium">${v.channel}</p>
                                    </div>
                                </div>
                            </div>
                        `);
                    }
                });
            } catch (e) { console.error(e); }
            finally { isLoading = false; loader.style.opacity = "0"; }
        }

        // SCROLL INFINITO
        window.addEventListener('scroll', () => {
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 1000) {
                if(!isLoading) realizarPesquisa(temas[Math.floor(Math.random()*temas.length)], false);
            }
        });

        function saveAndPlay(id, title, thumb, channel) {
            history = history.filter(i => i.id !== id);
            history.unshift({ id, title, thumbnail: thumb, channel });
            if(history.length > 20) history.pop();
            localStorage.setItem('rp_history', JSON.stringify(history));
            renderHistory();
            openPlayer(id);
        }

        function renderHistory() {
            const section = document.getElementById('historySection');
            const grid = document.getElementById('historyGrid');
            if(history.length > 0) {
                section.classList.remove('hidden');
                grid.innerHTML = history.map(v => `
                    <div class="min-w-[220px] cursor-pointer group" onclick="openPlayer('${v.id}')">
                        <div class="relative aspect-video rounded-2xl overflow-hidden border border-zinc-800 mb-2">
                            <img src="${v.thumbnail}" class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition duration-500">
                            <div class="absolute bottom-0 left-0 h-1 bg-red-600" style="width: 90%"></div>
                        </div>
                        <h4 class="text-[11px] font-semibold line-clamp-1 text-zinc-400 group-hover:text-white transition">${v.title}</h4>
                    </div>
                `).join('');
            }
        }

        function openPlayer(id) {
            document.getElementById('playerWrapper').classList.remove('hidden');
            if (player) player.loadVideoById(id);
            else {
                player = new YT.Player('ytPlayer', {
                    height: '100%', width: '100%', videoId: id,
                    playerVars: { 'autoplay': 1, 'rel': 0, 'modestbranding': 1, 'origin': window.location.origin },
                    events: { 'onStateChange': (e) => e.data === YT.PlayerState.ENDED && playNext() }
                });
            }
            setFull();
        }

        function playNext() {
            player.loadVideoById(videoPool[Math.floor(Math.random()*videoPool.length)]);
        }

        function togglePlayerMode() {
            const c = document.getElementById('playerContainer');
            c.classList.contains('mini-player') ? setFull() : setMini();
        }

        function setFull() {
            document.getElementById('playerContainer').className = "full-player";
            document.body.style.overflow = 'hidden';
        }

        function setMini() {
            document.getElementById('playerContainer').className = "mini-player";
            document.body.style.overflow = 'auto';
        }

        function closePlayer() {
            player.stopVideo();
            document.getElementById('playerWrapper').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        document.getElementById('searchInput').addEventListener('keypress', (e) => e.key === 'Enter' && realizarPesquisa(e.target.value, true));
    </script>
</body>
</html>
