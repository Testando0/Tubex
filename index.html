<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RubiTube Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { font-family: 'Roboto', sans-serif; background-color: #0f0f0f; color: white; }
    .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    @media (max-width: 640px) { .video-grid { grid-template-columns: 1fr; } }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .modal-open { overflow: hidden; }
  </style>
</head>
<body>

<nav class="sticky top-0 z-50 bg-[#0f0f0f] border-b border-zinc-800 px-4 h-14 flex items-center justify-between">
  <div class="flex items-center gap-1 text-red-600 font-bold text-xl cursor-pointer" onclick="location.reload()">
    <i class="fa-solid fa-gem"></i> <span>RubiTube</span>
  </div>
  
  <form id="searchForm" class="flex-1 max-w-md mx-4">
    <div class="flex bg-zinc-900 border border-zinc-700 rounded-full overflow-hidden">
      <input id="searchInput" type="text" placeholder="Pesquisar" class="bg-transparent w-full px-4 py-1 outline-none text-sm">
      <button type="submit" class="bg-zinc-800 px-4 border-l border-zinc-700 hover:bg-zinc-700">
        <i class="fa-solid fa-magnifying-glass text-sm"></i>
      </button>
    </div>
  </form>

  <div class="w-8 h-8 bg-purple-600 rounded-full flex items-center justify-center text-xs font-bold">R</div>
</nav>

<main class="p-4 sm:p-6">
  <div id="results" class="video-grid"></div>
  
  <div id="loading" class="hidden text-center py-20">
    <div class="inline-block w-8 h-8 border-4 border-red-600 border-t-transparent rounded-full animate-spin"></div>
  </div>
</main>

<div id="playerModal" class="fixed inset-0 bg-black z-[100] hidden flex-col">
  <div class="flex items-center p-4 bg-[#0f0f0f] border-b border-zinc-800">
    <button onclick="closePlayer()" class="text-2xl mr-4"><i class="fa-solid fa-xmark"></i></button>
    <span class="text-sm font-medium truncate flex-1" id="playingTitle">Carregando...</span>
  </div>

  <div class="w-full aspect-video bg-black">
    <iframe id="mainIframe" class="w-full h-full" allowfullscreen allow="autoplay"></iframe>
  </div>

  <div class="p-6 bg-[#0f0f0f] flex-1">
    <h2 class="text-lg font-bold mb-2" id="detailTitle">Título do Vídeo</h2>
    <p class="text-sm text-zinc-400 mb-6" id="detailAuthor">Nome do Canal</p>

    <div class="flex justify-center items-center gap-10 mt-10">
      <button onclick="playPrev()" class="text-3xl text-zinc-300 hover:text-white disabled:opacity-20" id="prevBtn">
        <i class="fa-solid fa-backward-step"></i>
      </button>
      
      <button onclick="closePlayer()" class="w-16 h-16 bg-white text-black rounded-full flex items-center justify-center text-2xl">
        <i class="fa-solid fa-play"></i>
      </button>

      <button onclick="playNext()" class="text-3xl text-zinc-300 hover:text-white disabled:opacity-20" id="nextBtn">
        <i class="fa-solid fa-forward-step"></i>
      </button>
    </div>
  </div>
</div>

<script>
const API_BASE = "https://redzinapi-tech.onrender.com/youtube/search";
const API_KEY = "REDZ";

let videosData = [];
let currentIndex = -1;

// Busca Inicial
window.onload = () => performSearch("musicas 2026");

async function performSearch(query) {
  if (!query) return;
  const loader = document.getElementById('loading');
  const results = document.getElementById('results');
  
  loader.classList.remove('hidden');
  results.innerHTML = '';

  try {
    // Correção da URL: Template string padrão do JS
    const url = `${API_BASE}?query=${encodeURIComponent(query)}&apikey=${API_KEY}`;
    const response = await fetch(url);
    const data = await response.json();

    if (data.status && data.resultado) {
      videosData = data.resultado.filter(i => i.type === 'video');
      renderVideos(videosData);
    }
  } catch (e) {
    console.error("Erro na busca:", e);
    results.innerHTML = '<p class="text-center w-full py-10 text-zinc-500">Erro ao carregar vídeos.</p>';
  } finally {
    loader.classList.add('hidden');
  }
}

function renderVideos(list) {
  const results = document.getElementById('results');
  results.innerHTML = list.map((v, i) => `
    <div class="cursor-pointer group" onclick="openPlayer(${i})">
      <div class="relative aspect-video rounded-xl overflow-hidden bg-zinc-800">
        <img src="${v.image}" class="w-full h-full object-cover group-hover:scale-105 transition-transform">
        <span class="absolute bottom-2 right-2 bg-black/80 text-[11px] px-1.5 py-0.5 rounded">${v.timestamp}</span>
      </div>
      <div class="mt-3 flex gap-3">
        <div class="w-9 h-9 bg-zinc-700 rounded-full flex-shrink-0"></div>
        <div>
          <h3 class="text-sm font-bold line-clamp-2 leading-tight">${v.title}</h3>
          <p class="text-xs text-zinc-400 mt-1">${v.author.name} • ${v.ago}</p>
        </div>
      </div>
    </div>
  `).join('');
}

function openPlayer(index) {
  currentIndex = index;
  const video = videosData[index];
  if (!video) return;

  const modal = document.getElementById('playerModal');
  const iframe = document.getElementById('mainIframe');
  
  document.getElementById('playingTitle').innerText = video.title;
  document.getElementById('detailTitle').innerText = video.title;
  document.getElementById('detailAuthor').innerText = video.author.name;
  
  // Modestbranding=1 tenta remover a logo, mas o YouTube às vezes ignora
  iframe.src = `https://www.youtube.com/embed/${video.videoId}?autoplay=1&modestbranding=1&rel=0`;
  
  modal.classList.remove('hidden');
  modal.classList.add('flex');
  document.body.classList.add('modal-open');
  updateControlButtons();
}

function closePlayer() {
  const modal = document.getElementById('playerModal');
  const iframe = document.getElementById('mainIframe');
  iframe.src = '';
  modal.classList.add('hidden');
  document.body.classList.remove('modal-open');
}

function playNext() {
  if (currentIndex < videosData.length - 1) openPlayer(currentIndex + 1);
}

function playPrev() {
  if (currentIndex > 0) openPlayer(currentIndex - 1);
}

function updateControlButtons() {
  document.getElementById('prevBtn').disabled = currentIndex === 0;
  document.getElementById('nextBtn').disabled = currentIndex === videosData.length - 1;
}

document.getElementById('searchForm').onsubmit = (e) => {
  e.preventDefault();
  performSearch(document.getElementById('searchInput').value);
};
</script>

</body>
</html>
