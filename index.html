<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="RedPlay">
    <meta name="theme-color" content="#080808">
    
    <link rel="apple-touch-icon" href="https://uploads.zero-two-apis.com.br/uploads/images/48417970227bd8389b054f1c4823bbf9d4bf0eb3b8965e2e360d0101ca12c7d1.jpg">
    <link rel="icon" type="image/jpg" href="https://uploads.zero-two-apis.com.br/uploads/images/48417970227bd8389b054f1c4823bbf9d4bf0eb3b8965e2e360d0101ca12c7d1.jpg">

    <link rel="manifest" href='data:application/manifest+json,{"name":"REDPLAY Pro","short_name":"RedPlay","start_url":".","display":"standalone","background_color":"#080808","theme_color":"#ff0000","icons":[{"src":"https://uploads.zero-two-apis.com.br/uploads/images/48417970227bd8389b054f1c4823bbf9d4bf0eb3b8965e2e360d0101ca12c7d1.jpg","sizes":"512x512","type":"image/jpg"}]}'>

    <title>REDPLAY Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.youtube.com/iframe_api"></script>
    
    <style>
        /* Reset para App Nativo */
        * { 
            -webkit-tap-highlight-color: transparent; 
            -webkit-touch-callout: none;
            user-select: none;
            outline: none;
        }
        
        input { user-select: auto; } /* Permite digitar no campo de busca */

        body { 
            background-color: #080808; 
            color: white; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden; 
            overscroll-behavior-y: contain; /* Evita o "pull-to-refresh" do navegador */
            padding-top: env(safe-area-inset-top); /* Respeita o notch do iPhone */
        }
        
        /* Estilização da Nav Bar Nativa */
        nav {
            padding-top: env(safe-area-inset-top);
            height: calc(4rem + env(safe-area-inset-top));
        }

        .redplay-logo { 
            background: linear-gradient(135deg, #ff0000, #990000); 
            width: 38px; height: 38px; border-radius: 12px; 
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.3);
        }

        /* Player Nativo Otimizado */
        #playerWrapper { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 5000; pointer-events: none;
            background: rgba(0,0,0,0);
            transition: background 0.3s;
        }
        #playerWrapper.active { background: rgba(0,0,0,1); pointer-events: auto; }

        #playerContainer { 
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1); 
            background: black; overflow: hidden;
        }

        .full-player { 
            position: absolute; top: 0; left: 0; 
            width: 100vw; height: 100dvh; 
            border-radius: 0;
        }
        
        .mini-player { 
            position: fixed !important; 
            bottom: calc(20px + env(safe-area-inset-bottom)); 
            right: 20px;
            width: 160px !important; height: 90px !important; 
            border-radius: 16px; 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            z-index: 5001;
        }

        @media (max-width: 640px) { 
            .mini-player { 
                bottom: env(safe-area-inset-bottom); 
                left: 0; width: 100% !important; height: 70px !important; 
                border-radius: 0; border: none; border-top: 1px solid #333; 
            } 
        }

        /* Grid de Vídeo Estilo App */
        .video-card {
            transition: transform 0.2s cubic-bezier(0.2, 0, 0, 1);
        }
        .video-card:active { transform: scale(0.96); opacity: 0.8; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Controles flutuantes */
        .control-btn {
            width: 55px; height: 55px; border-radius: 50%;
            background: rgba(255,255,255,0.15); backdrop-filter: blur(15px);
            display: flex; align-items: center; justify-content: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body class="antialiased">

    <nav class="fixed top-0 w-full bg-[#080808]/95 backdrop-blur-xl z-[3000] flex items-center justify-between px-4 border-b border-zinc-900">
        <div class="flex items-center gap-3 cursor-pointer" onclick="location.reload()">
            <div class="redplay-logo"><i class="fa-solid fa-play text-white text-sm"></i></div>
            <span class="text-xl font-black uppercase tracking-tighter">RedPlay</span>
        </div>
        
        <div class="flex-1 max-w-[500px] mx-4">
            <div class="flex bg-zinc-900/50 border border-zinc-800 rounded-2xl px-4 py-2 focus-within:border-red-600 focus-within:bg-zinc-900 transition-all">
                <input id="searchInput" type="text" placeholder="Artistas, músicas..." class="bg-transparent w-full outline-none text-sm text-white">
                <button id="searchBtn" class="ml-2 text-zinc-400"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
        </div>
        <div id="avatar" class="cat-avatar shadow-lg shadow-red-900/20"></div>
    </nav>

    <main class="pt-28 pb-20 p-4 lg:p-8 max-w-[2000px] mx-auto">
        <div id="historySection" class="hidden mb-12">
            <h2 class="text-xs font-bold text-red-500 mb-5 uppercase tracking-[0.2em] px-1">Histórico</h2>
            <div id="historyGrid" class="flex gap-4 overflow-x-auto no-scrollbar pb-2"></div>
        </div>

        <div id="errorMsg" class="hidden text-center text-zinc-500 py-20 animate-pulse">
            <i class="fa-solid fa-circle-exclamation text-5xl mb-4 text-zinc-800"></i>
            <p id="errorText" class="font-medium text-lg">Buscando conteúdo...</p>
        </div>

        <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-6 gap-x-5 gap-y-12"></div>
        
        <div id="loaderScroll" class="py-12 text-center opacity-0 transition-opacity">
            <div class="inline-block w-10 h-10 border-[3px] border-t-red-600 border-zinc-800 rounded-full animate-spin"></div>
        </div>
    </main>

    <div id="playerWrapper">
        <div id="playerContainer" class="full-player" onclick="showControlsTemporarily()">
            <div class="absolute top-0 w-full p-6 flex justify-between items-start z-[6000] pointer-events-none">
                <div class="flex gap-3 pointer-events-auto">
                    <button onclick="closePlayer()" class="w-12 h-12 bg-black/40 backdrop-blur-md rounded-2xl text-white flex items-center justify-center border border-white/10 active:scale-90 transition"><i class="fa-solid fa-chevron-down text-xl"></i></button>
                </div>
                <div class="flex gap-3 pointer-events-auto">
                    <button onclick="togglePlayerMode()" class="w-12 h-12 bg-black/40 backdrop-blur-md rounded-2xl text-white flex items-center justify-center border border-white/10 active:scale-90 transition"><i class="fa-solid fa-compress"></i></button>
                </div>
            </div>

            <div class="player-controls opacity-0 transition-opacity duration-300" id="customControls">
                <div class="flex gap-6 items-center">
                    <button onclick="event.stopPropagation(); seekVideo(-10)" class="control-btn active:bg-red-600/20"><i class="fa-solid fa-backward-step"></i></button>
                    <button onclick="event.stopPropagation(); playPrev()" class="control-btn active:bg-red-600/20"><i class="fa-solid fa-backward"></i></button>
                    <button onclick="event.stopPropagation(); playNext()" class="control-btn active:bg-red-600/20"><i class="fa-solid fa-forward"></i></button>
                    <button onclick="event.stopPropagation(); seekVideo(10)" class="control-btn active:bg-red-600/20"><i class="fa-solid fa-forward-step"></i></button>
                </div>
            </div>

            <div id="ytPlayer"></div>
        </div>
    </div>

    <script>
        document.getElementById('avatar').style.backgroundImage = `url('https://cataas.com/cat?width=100&t=${Math.random()}')`;

        let player, videoPool = [], history = JSON.parse(localStorage.getItem('rp_history')) || [], isLoading = false;
        let currentQuery = "Destaques", currentIndex = -1, controlTimer;
        
        const initialTerms = ["Pop 2024", "Trap Hits", "Sertanejo", "Lo-Fi Music", "Techno"];

        function onYouTubeIframeAPIReady() { 
            renderHistory(); 
            realizarPesquisa("Destaques", true); 
        }

        async function realizarPesquisa(query, limpar = true) {
            if (isLoading && !limpar) return;
            isLoading = true;
            const loader = document.getElementById('loaderScroll');
            const errorMsg = document.getElementById('errorMsg');
            loader.style.opacity = "1";

            let searchTerm = (query === "Destaques") ? initialTerms[Math.floor(Math.random()*initialTerms.length)] : query;

            if(limpar) { 
                document.getElementById('videoGrid').innerHTML = ""; 
                videoPool = []; 
                window.scrollTo(0,0); 
                currentQuery = query;
                errorMsg.classList.add('hidden');
            }

            try {
                const targetUrl = `https://redzinapi-tech.onrender.com/youtube/search?query=${encodeURIComponent(searchTerm)}&apikey=REDZ`;
                const response = await fetch(`https://corsproxy.io/?${encodeURIComponent(targetUrl)}`);
                const data = await response.json();
                
                if (data.status && data.resultado) {
                    data.resultado.forEach(v => {
                        if (v.type === 'video' && !videoPool.find(item => item.id === v.videoId)) {
                            addVideoToGrid(v);
                        }
                    });
                }
            } catch (error) {
                console.error(error);
            } finally {
                isLoading = false; 
                loader.style.opacity = "0"; 
            }
        }

        function addVideoToGrid(v) {
            const videoData = {
                id: v.videoId, title: v.title, 
                thumb: v.thumbnail || v.image, 
                artist: v.author?.name || 'YouTube',
                duration: v.timestamp || "--:--",
                views: formatViews(v.views)
            };
            videoPool.push(videoData);
            
            const html = `
                <div class="video-card cursor-pointer group" onclick="saveAndPlay('${videoData.id}', \`${escapeHtml(videoData.title)}\`, '${videoData.thumb}', \`${escapeHtml(videoData.artist)}\`)">
                    <div class="relative aspect-video rounded-2xl overflow-hidden bg-zinc-900 mb-4 shadow-xl">
                        <img src="${videoData.thumb}" class="w-full h-full object-cover">
                        <span class="absolute bottom-3 right-3 bg-black/80 backdrop-blur-md px-2 py-1 rounded-lg text-[10px] font-bold text-white">${videoData.duration}</span>
                    </div>
                    <h3 class="font-bold text-base line-clamp-2 leading-tight mb-1 group-hover:text-red-500 transition">${videoData.title}</h3>
                    <p class="text-zinc-500 text-xs font-medium">${videoData.artist} • ${videoData.views}</p>
                </div>`;
            document.getElementById('videoGrid').insertAdjacentHTML('beforeend', html);
        }

        function formatViews(num) {
            if(!num) return '';
            if(typeof num === 'string') return num;
            return num >= 1000000 ? (num/1000000).toFixed(1) + 'M' : num >= 1000 ? (num/1000).toFixed(1) + 'K' : num;
        }

        function escapeHtml(text) { return text ? text.replace(/'/g, "\\'").replace(/"/g, '\\"') : ""; }

        function saveAndPlay(id, title, thumb, artist) {
            currentIndex = videoPool.findIndex(v => v.id === id);
            history = history.filter(i => i.id !== id);
            history.unshift({id, title, thumbnail: thumb, channel: artist});
            localStorage.setItem('rp_history', JSON.stringify(history.slice(0, 15)));
            renderHistory();
            openPlayer(id);
        }

        function openPlayer(id) {
            const wrap = document.getElementById('playerWrapper');
            wrap.classList.add('active');
            if (player?.loadVideoById) {
                player.loadVideoById(id);
            } else {
                player = new YT.Player('ytPlayer', { 
                    height:'100%', width:'100%', videoId:id, 
                    playerVars:{'autoplay':1, 'rel':0, 'controls':1, 'playsinline': 1, 'modestbranding': 1}, 
                    events:{ 'onStateChange':(e)=>{ if(e.data===0) playNext(); } } 
                });
            }
            document.getElementById('playerContainer').className = "full-player";
            document.body.style.overflow = 'hidden';
        }

        function closePlayer() { 
            if(player?.stopVideo) player.stopVideo(); 
            document.getElementById('playerWrapper').classList.remove('active'); 
            document.body.style.overflow = 'auto'; 
        }

        function togglePlayerMode() {
            const container = document.getElementById('playerContainer');
            const isFull = container.classList.contains('full-player');
            container.className = isFull ? "mini-player" : "full-player";
            document.getElementById('playerWrapper').style.pointerEvents = isFull ? "none" : "auto";
            document.body.style.overflow = isFull ? "auto" : "hidden";
        }

        function showControlsTemporarily() {
            const c = document.getElementById('customControls');
            c.classList.remove('opacity-0');
            clearTimeout(controlTimer);
            controlTimer = setTimeout(() => c.classList.add('opacity-0'), 3000);
        }

        function renderHistory() {
            const grid = document.getElementById('historyGrid');
            if(!grid || history.length === 0) return;
            grid.innerHTML = history.map(v => `
                <div class="min-w-[120px] max-w-[120px] cursor-pointer" onclick="openPlayer('${v.id}')">
                    <div class="relative aspect-square rounded-2xl overflow-hidden mb-2 border border-zinc-800">
                        <img src="${v.thumbnail}" class="w-full h-full object-cover">
                    </div>
                    <h4 class="text-[11px] font-bold line-clamp-1 text-zinc-400">${v.title}</h4>
                </div>
            `).join('');
            document.getElementById('historySection').classList.remove('hidden');
        }

        document.getElementById('searchBtn').onclick = () => {
            const q = document.getElementById('searchInput').value;
            if(q.trim()) realizarPesquisa(q, true);
        };
        
        document.getElementById('searchInput').onkeypress = (e) => {
            if(e.key === 'Enter' && e.target.value.trim()) realizarPesquisa(e.target.value, true);
        };

        window.onscroll = () => {
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 800) {
                if(!isLoading) realizarPesquisa(currentQuery, false);
            }
        };
    </script>
</body>
</html>
