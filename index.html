<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>REDPLAY Pro - Fixed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.youtube.com/iframe_api"></script>
    
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { background-color: #080808; color: white; font-family: sans-serif; overflow-x: hidden; overscroll-behavior-y: auto; }
        
        .redplay-logo { background: linear-gradient(135deg, #ff0000, #990000); width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
        .cat-avatar { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #ff0000; background-size: cover; background-position: center; cursor: pointer; }
        
        #playerWrapper { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 5000; pointer-events: none;
        }

        #playerContainer { 
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); 
            pointer-events: auto; background: black; overflow: hidden;
        }

        .full-player { position: absolute; top: 0; left: 0; width: 100vw; height: 100dvh; }
        
        .mini-player { 
            position: fixed !important; bottom: 20px; right: 20px;
            width: 300px !important; height: 170px !important; 
            border-radius: 12px; border: 2px solid #ff0000; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.8); 
        }

        @media (max-width: 640px) { 
            .mini-player { bottom: 0; left: 0; width: 100% !important; height: 80px !important; border-radius: 0; border: none; border-top: 2px solid #ff0000; } 
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }

        .player-controls {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            gap: 20px; z-index: 5500; background: rgba(0,0,0,0.5);
            opacity: 0; transition: opacity 0.3s; pointer-events: none;
        }
        #playerContainer:hover .player-controls, .player-controls.active { opacity: 1; pointer-events: auto; }
        
        .control-btn {
            width: 50px; height: 50px; border-radius: 50%;
            background: rgba(255,255,255,0.1); backdrop-filter: blur(8px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 16px; color: white; transition: 0.2s; border: 1px solid rgba(255,255,255,0.1);
        }
        .control-btn:active { transform: scale(0.9); background: rgba(255,0,0,0.4); }
        .mini-player .player-controls { display: none; }
    </style>
</head>
<body class="antialiased">

    <nav class="fixed top-0 w-full bg-[#080808]/90 backdrop-blur-md z-[3000] flex items-center justify-between px-4 h-16 border-b border-zinc-900">
        <div class="flex items-center gap-2 cursor-pointer" onclick="location.reload()">
            <div class="redplay-logo"><i class="fa-solid fa-play text-white text-xs"></i></div>
            <span class="text-xl font-black uppercase tracking-tighter">RedPlay</span>
        </div>
        
        <div class="flex-1 max-w-[400px] mx-4">
            <div class="flex bg-zinc-900 border border-zinc-800 rounded-full px-4 py-1.5 focus-within:border-red-600">
                <input id="searchInput" type="text" placeholder="Pesquisar..." class="bg-transparent w-full outline-none text-sm text-white">
                <button id="searchBtn" class="ml-2 text-zinc-400"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
        </div>
        <div id="avatar" class="cat-avatar"></div>
    </nav>

    <main class="pt-24 pb-10 p-4 lg:p-8 max-w-[2000px] mx-auto">
        <div id="historySection" class="hidden mb-10">
            <h2 class="text-xs font-bold text-red-500 mb-4 uppercase tracking-widest">Continuar assistindo</h2>
            <div id="historyGrid" class="flex gap-4 overflow-x-auto no-scrollbar pb-2"></div>
        </div>

        <div id="errorMsg" class="hidden text-center text-zinc-500 py-10">
            <i class="fa-solid fa-circle-exclamation text-4xl mb-2"></i>
            <p>Nenhum resultado encontrado ou erro na conexão.</p>
        </div>

        <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-6 gap-x-4 gap-y-10"></div>
        
        <div id="loaderScroll" class="py-10 text-center opacity-0 transition-opacity duration-300">
            <div class="inline-block w-8 h-8 border-2 border-t-red-600 border-zinc-800 rounded-full animate-spin"></div>
        </div>
    </main>

    <div id="playerWrapper" class="hidden">
        <div id="playerContainer" class="full-player" onclick="showControlsTemporarily()">
            <div class="absolute top-5 left-5 z-[6000] flex gap-3">
                <button onclick="closePlayer()" class="w-10 h-10 bg-black/60 rounded-full text-red-500 flex items-center justify-center border border-white/10"><i class="fa-solid fa-xmark"></i></button>
                <button onclick="togglePlayerMode()" class="w-10 h-10 bg-black/60 rounded-full text-white flex items-center justify-center border border-white/10"><i class="fa-solid fa-compress"></i></button>
            </div>

            <div class="player-controls" id="customControls">
                <button onclick="event.stopPropagation(); seekVideo(-10)" class="control-btn"><i class="fa-solid fa-rotate-left"></i><span class="text-[8px] font-bold">10s</span></button>
                <button onclick="event.stopPropagation(); playPrev()" class="control-btn"><i class="fa-solid fa-backward"></i></button>
                <button onclick="event.stopPropagation(); playNext()" class="control-btn"><i class="fa-solid fa-forward"></i></button>
                <button onclick="event.stopPropagation(); seekVideo(10)" class="control-btn"><i class="fa-solid fa-rotate-right"></i><span class="text-[8px] font-bold">10s</span></button>
            </div>

            <div id="ytPlayer"></div>
        </div>
    </div>

    <script>
        document.getElementById('avatar').style.backgroundImage = `url('https://cataas.com/cat?width=100&t=${Math.random()}')`;

        let player, videoPool = [], history = JSON.parse(localStorage.getItem('rp_history')) || [], isLoading = false;
        let currentQuery = "Destaques", currentIndex = -1, controlTimer;
        
        // Termos variados para garantir que a API retorne vídeos diferentes
        const initialTerms = [
            "Alok", "Gusttavo Lima", "Anitta", "Marilia Mendonca", 
            "Linkin Park", "Coldplay", "Eminem", "Bruno Mars", 
            "The Weeknd", "Dua Lipa", "Imagine Dragons", "Post Malone"
        ];

        function onYouTubeIframeAPIReady() { 
            renderHistory(); 
            realizarPesquisa("Destaques", true); 
        }

        async function fetchSingleVideo(searchTerm) {
            try {
                // USA UM PROXY CORS para evitar erro de bloqueio do navegador
                const targetUrl = `https://api.vreden.my.id/api/v1/download/play/video?query=${encodeURIComponent(searchTerm)}`;
                // Usando corsproxy.io para passar pelo bloqueio
                const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;
                
                const response = await fetch(proxyUrl);
                const data = await response.json();
                
                if (data.status && data.result && data.result.metadata) {
                    return data.result.metadata;
                }
            } catch (error) {
                console.log("Erro ao buscar termo:", searchTerm);
            }
            return null;
        }

        async function realizarPesquisa(query, limpar = true) {
            if (isLoading && !limpar) return;
            isLoading = true;
            
            const loader = document.getElementById('loaderScroll');
            const grid = document.getElementById('videoGrid');
            const errorMsg = document.getElementById('errorMsg');
            
            loader.style.opacity = "1";
            errorMsg.classList.add('hidden');

            if(limpar) { 
                grid.innerHTML = ""; 
                videoPool = []; 
                window.scrollTo(0,0); 
                currentQuery = query;
                document.getElementById('historySection').className = (history.length > 0) ? "mb-10" : "hidden";
            }

            let searchTerms = [];

            if (query === "Destaques") {
                // Embaralha e pega 8 termos da lista inicial
                searchTerms = initialTerms.sort(() => 0.5 - Math.random()).slice(0, 8);
            } else {
                // Cria variações da pesquisa do usuário para tentar obter vídeos diferentes
                searchTerms = [
                    query,
                    `${query} official`,
                    `${query} video clip`,
                    `${query} ao vivo`,
                    `${query} remix`
                ];
            }

            // Faz todas as requisições ao mesmo tempo
            const promises = searchTerms.map(term => fetchSingleVideo(term));
            const results = await Promise.all(promises);
            
            let videosAdded = 0;

            results.forEach(v => {
                // Verifica duplicatas pelo ID
                if (v && !videoPool.find(item => item.id === v.videoId)) {
                    addVideoToGrid(v);
                    videosAdded++;
                }
            });

            // Se não encontrou nada, tenta uma segunda rodada de busca com o termo puro
            if (videosAdded === 0 && query !== "Destaques" && limpar) {
                errorMsg.classList.remove('hidden');
                errorMsg.innerHTML = `<p>Nada encontrado para "${query}". Tente outro termo.</p>`;
            } else if (videosAdded === 0 && query === "Destaques") {
                 // Fallback se a API falhar totalmente
                 errorMsg.classList.remove('hidden');
                 errorMsg.innerHTML = `<p>Erro de conexão com a API.</p>`;
            }

            isLoading = false; 
            loader.style.opacity = "0"; 
        }

        function addVideoToGrid(v) {
            const videoData = {
                id: v.videoId, 
                title: v.title, 
                thumb: v.thumbnail || v.image, 
                artist: v.author.name,
                duration: v.timestamp || "VIDEO",
                views: formatViews(v.views)
            };

            videoPool.push(videoData);
            
            const html = `
                <div class="cursor-pointer group animate-in fade-in duration-500" onclick="saveAndPlay('${videoData.id}', \`${escapeHtml(videoData.title)}\`, '${videoData.thumb}', \`${escapeHtml(videoData.artist)}\`)">
                    <div class="relative aspect-square rounded-xl overflow-hidden bg-zinc-900 mb-3 border border-zinc-800">
                        <img src="${videoData.thumb}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" loading="lazy">
                        <span class="absolute bottom-2 right-2 bg-black/90 px-2 py-0.5 rounded text-[10px] font-bold text-red-500">${videoData.duration}</span>
                    </div>
                    <h3 class="font-bold text-sm line-clamp-2 group-hover:text-red-500 transition">${videoData.title}</h3>
                    <p class="text-zinc-500 text-xs mt-1">${videoData.artist}</p>
                    <p class="text-zinc-600 text-[10px] mt-0.5">${videoData.views} • ${v.ago || 'YouTube'}</p>
                </div>`;
            
            document.getElementById('videoGrid').insertAdjacentHTML('beforeend', html);
        }

        function formatViews(num) {
            if(!num) return '';
            if(num >= 1000000000) return Math.floor(num/1000000000) + 'B';
            if(num >= 1000000) return Math.floor(num/1000000) + 'M';
            if(num >= 1000) return Math.floor(num/1000) + 'K';
            return num;
        }

        function escapeHtml(text) {
            if (!text) return "";
            return text.replace(/'/g, "\\'").replace(/"/g, '\\"');
        }

        window.onscroll = () => {
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500) {
                if(!isLoading && currentQuery === "Destaques") {
                    // Carrega mais termos aleatórios
                    const randomTerm = initialTerms[Math.floor(Math.random() * initialTerms.length)];
                    realizarPesquisa(randomTerm + " music", false);
                }
            }
        };

        function saveAndPlay(id, title, thumb, artist) {
            currentIndex = videoPool.findIndex(v => v.id === id);
            
            history = history.filter(i => i.id !== id);
            history.unshift({id, title, thumbnail: thumb, channel: artist});
            if(history.length > 15) history.pop(); 
            localStorage.setItem('rp_history', JSON.stringify(history));
            
            if(document.getElementById('historySection').className !== "hidden") renderHistory();
            openPlayer(id);
        }

        function openPlayer(id) {
            document.getElementById('playerWrapper').classList.remove('hidden');
            if (player && typeof player.loadVideoById === 'function') {
                player.loadVideoById(id);
            } else {
                player = new YT.Player('ytPlayer', { 
                    height:'100%', width:'100%', videoId:id, 
                    playerVars:{'autoplay':1, 'rel':0, 'controls':1, 'playsinline': 1}, 
                    events:{ 'onStateChange':(e)=>{ if(e.data===0) playNext(); } } 
                });
            }
            setFull();
        }

        function seekVideo(sec) { if(player) player.seekTo(player.getCurrentTime() + sec, true); }
        
        function playNext() { 
            if(currentIndex < videoPool.length-1) { 
                currentIndex++; 
                const next = videoPool[currentIndex];
                saveAndPlay(next.id, next.title, next.thumb, next.artist);
            } 
        }
        
        function playPrev() { 
            if(currentIndex > 0) { 
                currentIndex--; 
                const prev = videoPool[currentIndex];
                saveAndPlay(prev.id, prev.title, prev.thumb, prev.artist);
            } 
        }

        function showControlsTemporarily() {
            const c = document.getElementById('customControls');
            c.classList.add('active');
            clearTimeout(controlTimer);
            controlTimer = setTimeout(() => c.classList.remove('active'), 3000);
        }

        function togglePlayerMode() { 
            const container = document.getElementById('playerContainer');
            if(container.className.includes('full-player')) {
                container.className = "mini-player";
                document.body.style.overflow = 'auto';
            } else {
                container.className = "full-player";
                document.body.style.overflow = 'hidden';
            }
        }

        function setFull() { 
            document.getElementById('playerContainer').className = "full-player"; 
            document.body.style.overflow = 'hidden'; 
        }

        function closePlayer() { 
            if(player && player.stopVideo) player.stopVideo(); 
            document.getElementById('playerWrapper').classList.add('hidden'); 
            document.body.style.overflow = 'auto'; 
        }

        function renderHistory() {
            const grid = document.getElementById('historyGrid');
            if(!grid || history.length === 0) return;
            
            grid.innerHTML = history.map(v => `
                <div class="min-w-[140px] cursor-pointer group" onclick="openPlayer('${v.id}')">
                    <div class="relative aspect-square rounded-xl overflow-hidden mb-2 border border-zinc-800">
                        <img src="${v.thumbnail}" class="w-full h-full object-cover group-hover:scale-110 transition duration-300">
                    </div>
                    <h4 class="text-[11px] font-bold line-clamp-1 text-zinc-300 group-hover:text-white">${v.title}</h4>
                </div>
            `).join('');
            document.getElementById('historySection').classList.remove('hidden');
        }

        document.getElementById('searchBtn').onclick = () => {
            const query = document.getElementById('searchInput').value;
            if(query.trim()) realizarPesquisa(query, true);
        };
        
        document.getElementById('searchInput').onkeypress = (e) => {
            if(e.key === 'Enter' && e.target.value.trim()) realizarPesquisa(e.target.value, true);
        };
    </script>
</body>
</html>
