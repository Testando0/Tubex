<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Pro Clone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f0f0f; color: white; scroll-behavior: smooth; }
        .yt-red { color: #ff0000; }
        .yt-card:hover img { transform: scale(1.05); }
        .sidebar-item:hover { background-color: #272727; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #3f3f3f; border-radius: 10px; }
    </style>
</head>
<body class="antialiased">

    <nav class="fixed top-0 w-full bg-[#0f0f0f] z-50 flex items-center justify-between px-4 h-14 border-b border-zinc-800">
        <div class="flex items-center gap-4">
            <i class="fa-solid fa-bars text-xl p-2 cursor-pointer hover:bg-zinc-800 rounded-full"></i>
            <div class="flex items-center gap-1 cursor-pointer" onclick="location.reload()">
                <i class="fa-brands fa-youtube text-3xl yt-red"></i>
                <span class="text-xl font-bold tracking-tighter">YouTube</span>
            </div>
        </div>

        <div class="flex items-center flex-1 max-w-[720px] mx-10">
            <div class="flex w-full bg-zinc-900 border border-zinc-800 rounded-full items-center px-4 py-1.5 focus-within:border-blue-500 transition-all">
                <input id="searchInput" type="text" placeholder="Pesquisar" class="bg-transparent w-full outline-none text-zinc-200">
                <button id="searchBtn" class="pl-4 text-zinc-400 hover:text-white border-l border-zinc-700 ml-2">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>
        </div>

        <div class="flex items-center gap-4 px-2">
            <i class="fa-solid fa-video text-xl cursor-pointer hidden md:block"></i>
            <div class="w-8 h-8 bg-purple-700 rounded-full flex items-center justify-center font-bold">U</div>
        </div>
    </nav>

    <div class="flex pt-14">
        <aside class="hidden lg:block w-60 fixed left-0 h-screen p-3 space-y-1">
            <div class="sidebar-item flex items-center gap-5 p-3 rounded-xl bg-zinc-800">
                <i class="fa-solid fa-house"></i> <span>Início</span>
            </div>
            <div class="sidebar-item flex items-center gap-5 p-3 rounded-xl text-zinc-400">
                <i class="fa-solid fa-bolt"></i> <span>Shorts</span>
            </div>
            <hr class="border-zinc-800 my-4">
            <div class="sidebar-item flex items-center gap-5 p-3 rounded-xl text-zinc-400">
                <i class="fa-solid fa-clock-rotate-left"></i> <span>Histórico</span>
            </div>
        </aside>

        <main class="lg:ml-60 w-full p-4 lg:p-8">
            
            <div id="loader" class="hidden text-center py-20">
                <div class="inline-block w-10 h-10 border-4 border-zinc-600 border-t-red-600 rounded-full animate-spin"></div>
                <p class="mt-4 text-zinc-400">Buscando na rede...</p>
            </div>

            <div id="playerContainer" class="hidden mb-10 animate-in fade-in duration-500">
                <div class="aspect-video w-full max-w-5xl mx-auto bg-black rounded-2xl overflow-hidden shadow-2xl border border-zinc-800">
                    <iframe id="mainPlayer" class="w-full h-full" src="" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
                </div>
                <div class="max-w-5xl mx-auto mt-6">
                    <h1 id="mainTitle" class="text-2xl font-bold line-clamp-2"></h1>
                    <div class="flex items-center justify-between mt-4 flex-wrap gap-4">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 bg-zinc-800 rounded-full flex items-center justify-center">
                                <i class="fa-solid fa-user text-zinc-500"></i>
                            </div>
                            <div>
                                <p id="mainAuthor" class="font-bold"></p>
                                <p class="text-xs text-zinc-400">API Verified</p>
                            </div>
                            <button class="bg-white text-black px-4 py-2 rounded-full font-bold text-sm ml-4 hover:bg-zinc-200">Inscrever-se</button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="videoGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-6">
                </div>
        </main>
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const loader = document.getElementById('loader');
        const grid = document.getElementById('videoGrid');
        const playerContainer = document.getElementById('playerContainer');

        async function buscarVideo() {
            const query = searchInput.value.trim();
            if (!query) return;

            loader.classList.remove('hidden');
            
            try {
                // USANDO CORSPROXY.IO PARA BYPASSAR O ERRO DE CORS
                const targetUrl = `https://api.vreden.my.id/api/v1/download/play/video?query=${encodeURIComponent(query)}`;
                const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;

                const response = await fetch(proxyUrl);
                const data = await response.json();

                if (data.status && data.result.metadata) {
                    const meta = data.result.metadata;
                    
                    // Atualiza Player
                    document.getElementById('mainPlayer').src = `https://www.youtube.com/embed/${meta.videoId}?autoplay=1`;
                    document.getElementById('mainTitle').innerText = meta.title;
                    document.getElementById('mainAuthor').innerText = meta.author.name;
                    
                    playerContainer.classList.remove('hidden');
                    window.scrollTo({ top: 0, behavior: 'smooth' });

                    // Adiciona Card
                    renderCard(meta);
                } else {
                    alert("Vídeo não encontrado.");
                }
            } catch (error) {
                console.error("Erro:", error);
                alert("Erro ao conectar à API via Proxy.");
            } finally {
                loader.classList.add('hidden');
            }
        }

        function renderCard(meta) {
            const cardHtml = `
                <div class="yt-card cursor-pointer group" onclick="playVideo('${meta.videoId}', '${meta.title.replace(/'/g, "\\'")}', '${meta.author.name}')">
                    <div class="relative rounded-xl overflow-hidden aspect-video bg-zinc-800 mb-3">
                        <img src="${meta.image}" class="w-full h-full object-cover transition-transform duration-500">
                        <span class="absolute bottom-2 right-2 bg-black/80 px-1.5 py-0.5 rounded text-[10px] font-bold">${meta.timestamp}</span>
                    </div>
                    <div class="flex gap-3">
                        <div class="w-9 h-9 bg-zinc-800 rounded-full flex-shrink-0 flex items-center justify-center font-bold text-[10px] text-zinc-500">YT</div>
                        <div>
                            <h3 class="font-bold text-sm leading-snug line-clamp-2 group-hover:text-zinc-200 transition-colors">${meta.title}</h3>
                            <p class="text-zinc-400 text-xs mt-1 hover:text-white">${meta.author.name}</p>
                            <p class="text-zinc-500 text-[11px]">${meta.ago}</p>
                        </div>
                    </div>
                </div>
            `;
            grid.insertAdjacentHTML('afterbegin', cardHtml);
        }

        function playVideo(id, title, author) {
            document.getElementById('mainPlayer').src = `https://www.youtube.com/embed/${id}?autoplay=1`;
            document.getElementById('mainTitle').innerText = title;
            document.getElementById('mainAuthor').innerText = author;
            playerContainer.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        searchBtn.addEventListener('click', buscarVideo);
        searchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') buscarVideo(); });
    </script>
</body>
</html>
