<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RubiTube</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://www.youtube.com/iframe_api"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    input { user-select: auto !important; }
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #0f0f0f;
      color: white;
      overscroll-behavior-y: contain;
      margin: 0;
    }
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
    }
    @media (max-width: 540px) {
      .video-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    }
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .fade-in { animation: fadeIn 0.35s ease-out both; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .modal-open { overflow: hidden !important; }
    #ytPlayer, #ytPlayer iframe {
      width: 100% !important;
      height: 100% !important;
      border: none;
    }
    .control-btn {
      border-radius: 50%;
      background: rgba(30,30,30,0.9);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,0.1);
      color: white;
      transition: all 0.2s;
      cursor: pointer;
    }
    .control-btn:hover:not(:disabled) { background: #9B111E; border-color: #9B111E; transform: scale(1.08); }
    .control-btn:disabled { opacity: 0.25; cursor: not-allowed; }
    .thumb-hover:hover .thumb-img { transform: scale(1.05); }
    .thumb-img { transition: transform 0.3s ease; }
    .play-overlay { opacity: 0; transition: opacity 0.2s; }
    .thumb-hover:hover .play-overlay { opacity: 1; }
    .card-title { transition: color 0.2s; }
    .thumb-hover:hover .card-title { color: #ff4444; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
  </style>
</head>
<body>

<!-- ═══════════════════ NAVBAR ═══════════════════ -->
<nav class="sticky top-0 z-50 bg-[#0f0f0f]/95 backdrop-blur-sm border-b border-zinc-800 px-3 sm:px-5 h-14 flex items-center justify-between gap-3">
  
  <button id="btnHome" class="flex items-center gap-1.5 text-red-600 font-extrabold text-lg flex-shrink-0 hover:text-red-500 transition-colors">
    <i class="fa-solid fa-gem"></i>
    <span class="hidden sm:inline">RubiTube</span>
  </button>

  <form id="searchForm" class="flex-1 max-w-xl">
    <div class="flex bg-zinc-900 border border-zinc-700 rounded-full overflow-hidden focus-within:border-zinc-500 transition-colors">
      <input id="searchInput" type="search" autocomplete="off"
             placeholder="Pesquisar vídeos..."
             class="bg-transparent flex-1 px-4 py-2 outline-none text-sm placeholder-zinc-500">
      <button type="submit"
              class="bg-zinc-800 px-4 border-l border-zinc-700 hover:bg-zinc-700 transition-colors flex-shrink-0">
        <i class="fa-solid fa-magnifying-glass text-sm text-zinc-300"></i>
      </button>
    </div>
  </form>

  <div id="avatar"
       class="w-9 h-9 rounded-full flex-shrink-0 border-2 border-zinc-700 bg-zinc-800 overflow-hidden"
       style="background-size:cover; background-position:center;">
  </div>
</nav>

<!-- ═══════════════════ MAIN ═══════════════════ -->
<main class="px-3 py-4 sm:px-6 sm:py-6 max-w-screen-2xl mx-auto">

  <!-- HISTÓRICO -->
  <section id="historySection" class="hidden mb-6">
    <h2 class="text-xs font-bold text-zinc-500 uppercase tracking-widest mb-3 flex items-center gap-2">
      <i class="fa-solid fa-clock-rotate-left text-red-600"></i>
      Assistido recentemente
    </h2>
    <div id="historyGrid"
         class="flex gap-3 overflow-x-auto no-scrollbar snap-x snap-mandatory pb-1">
    </div>
  </section>

  <!-- GRADE DE VÍDEOS -->
  <div id="videoGrid" class="video-grid"></div>

  <!-- LOADER SCROLL -->
  <div id="loaderScroll" class="text-center py-12 opacity-0 transition-opacity duration-300 pointer-events-none">
    <div class="inline-block w-7 h-7 border-[3px] border-red-600 border-t-transparent rounded-full animate-spin"></div>
  </div>

  <!-- ESTADO VAZIO -->
  <div id="emptyState" class="hidden text-center py-24 text-zinc-600">
    <i class="fa-solid fa-film text-5xl mb-4 block"></i>
    <p class="text-base">Nenhum vídeo encontrado</p>
    <p class="text-sm mt-1 text-zinc-700">Tente outro termo de busca</p>
  </div>

  <!-- ERRO -->
  <div id="errorState" class="hidden text-center py-24 text-zinc-600">
    <i class="fa-solid fa-triangle-exclamation text-5xl mb-4 block text-red-800"></i>
    <p class="text-base">Erro ao carregar vídeos</p>
    <button onclick="retrySearch()"
            class="mt-4 px-5 py-2 bg-red-700 hover:bg-red-600 rounded-full text-white text-sm transition-colors">
      Tentar novamente
    </button>
  </div>

</main>

<!-- ═══════════════════ PLAYER MODAL ═══════════════════ -->
<div id="playerWrapper"
     class="fixed inset-0 bg-[#0f0f0f] z-[100] hidden flex-col">

  <!-- Header do Player -->
  <div class="flex items-center gap-3 px-4 py-3 bg-[#0a0a0a] border-b border-zinc-800 flex-shrink-0">
    <button id="btnClosePlayer"
            class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-zinc-800 transition-colors text-zinc-300 hover:text-white">
      <i class="fa-solid fa-chevron-down text-lg"></i>
    </button>
    <span id="playingTitle" class="text-sm font-semibold text-zinc-200 truncate flex-1 leading-tight">
      Carregando...
    </span>
  </div>

  <!-- Área do Player YT -->
  <div class="w-full bg-black flex-shrink-0" style="aspect-ratio:16/9; position:relative;">
    <div id="ytPlayer" style="position:absolute;inset:0;"></div>
  </div>

  <!-- Informações e Controles -->
  <div class="flex-1 overflow-y-auto px-5 py-4 bg-[#0f0f0f]">
    <h2 id="detailTitle"
        class="text-base sm:text-lg font-bold leading-snug mb-1 text-white"></h2>
    <p id="detailAuthor"
       class="text-sm text-zinc-500 mb-6"></p>

    <!-- Botões de Controle -->
    <div class="flex justify-center items-center gap-6 mt-2">
      <button id="prevBtn" class="control-btn" data-action="prev" style="width:50px;height:50px;font-size:18px;" disabled>
        <i class="fa-solid fa-backward-step"></i>
      </button>

      <button id="togglePlayBtn" class="control-btn" data-action="togglePlay"
              style="width:64px;height:64px;font-size:26px;background:#9B111E;border-color:#9B111E;">
        <i id="playPauseIcon" class="fa-solid fa-pause"></i>
      </button>

      <button id="nextBtn" class="control-btn" data-action="next" style="width:50px;height:50px;font-size:18px;" disabled>
        <i class="fa-solid fa-forward-step"></i>
      </button>
    </div>

    <!-- Próximo vídeo -->
    <div id="upNextSection" class="mt-8 hidden">
      <p class="text-xs text-zinc-500 uppercase tracking-widest mb-3 font-bold">
        <i class="fa-solid fa-list-ul mr-1"></i> A seguir
      </p>
      <div id="upNextList" class="space-y-2"></div>
    </div>
  </div>
</div>

<!-- ═══════════════════ JAVASCRIPT ═══════════════════ -->
<script>
// ─────────────────────────────────────────────────────────
// ESTADO GLOBAL
// ─────────────────────────────────────────────────────────
const App = {
  player: null,
  ytReady: false,
  pendingVideoId: null,
  videoPool: [],
  history: [],
  isLoading: false,
  currentIndex: -1,
  currentSearch: 'Lançamentos Musicais 2026',
  isHome: true,
  isPlaying: false
};

try { App.history = JSON.parse(localStorage.getItem('rubi_history') || '[]'); } catch(e) {}

// ─────────────────────────────────────────────────────────
// YOUTUBE IFRAME API CALLBACK (chamado pelo script do YT)
// ─────────────────────────────────────────────────────────
window.onYouTubeIframeAPIReady = function() {
  App.ytReady = true;
  if (App.pendingVideoId) {
    initYTPlayer(App.pendingVideoId);
    App.pendingVideoId = null;
  }
};

// ─────────────────────────────────────────────────────────
// INICIALIZAÇÃO
// ─────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  // Avatar aleatório
  const seed = Math.random().toString(36).slice(2, 8);
  const avatarEl = document.getElementById('avatar');
  avatarEl.style.backgroundImage =
    `url('https://api.dicebear.com/7.x/avataaars/svg?seed=${seed}&backgroundColor=1a0a0a')`;

  // Eventos
  document.getElementById('searchForm').addEventListener('submit', handleSearch);
  document.getElementById('btnHome').addEventListener('click', goHome);
  document.getElementById('btnClosePlayer').addEventListener('click', closePlayer);

  ['prevBtn','nextBtn','togglePlayBtn'].forEach(id => {
    document.getElementById(id).addEventListener('click', e => {
      const action = e.currentTarget.dataset.action;
      if (action === 'prev') playPrev();
      else if (action === 'next') playNext();
      else if (action === 'togglePlay') togglePlayState();
    });
  });

  window.addEventListener('scroll', handleInfiniteScroll, { passive: true });

  renderHistory();
  fetchVideos(App.currentSearch, true);
});

// ─────────────────────────────────────────────────────────
// FETCH COM MÚLTIPLOS PROXIES (CORS)
// ─────────────────────────────────────────────────────────
const PROXIES = [
  url => `https://corsproxy.io/?url=${encodeURIComponent(url)}`,
  url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
  url => `https://thingproxy.freeboard.io/fetch/${url}`,
];

async function fetchWithProxy(apiUrl, timeoutMs = 12000) {
  for (const makeProxy of PROXIES) {
    const proxyUrl = makeProxy(apiUrl);
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), timeoutMs);
      const res = await fetch(proxyUrl, {
        signal: ctrl.signal,
        headers: { 'Accept': 'application/json' }
      });
      clearTimeout(timer);
      if (!res.ok) continue;
      const text = await res.text();
      const json = JSON.parse(text);
      if (json && json.status) return json;
    } catch(e) {
      console.warn('[proxy] falhou:', proxyUrl.slice(0, 60), e.message);
    }
  }
  return null;
}

// ─────────────────────────────────────────────────────────
// BUSCAR VÍDEOS
// ─────────────────────────────────────────────────────────
async function fetchVideos(query, clear = true) {
  if (App.isLoading) return;
  App.isLoading = true;

  showLoader(true);
  document.getElementById('emptyState').classList.add('hidden');
  document.getElementById('errorState').classList.add('hidden');

  if (clear) {
    document.getElementById('videoGrid').innerHTML = '';
    App.videoPool = [];
    App.currentSearch = query;
    if (!App.isHome) {
      document.getElementById('historySection').classList.add('hidden');
    }
  }

  const apiUrl =
    `https://redzinapi-tech.onrender.com/youtube/search` +
    `?query=${encodeURIComponent(query)}&apikey=REDZ`;

  const data = await fetchWithProxy(apiUrl);

  if (data && data.resultado) {
    const videos = data.resultado.filter(v => v.type === 'video');
    if (videos.length === 0 && clear) {
      document.getElementById('emptyState').classList.remove('hidden');
    }
    videos.forEach(v => {
      if (!App.videoPool.find(p => p.id === v.videoId)) {
        renderCard(v);
      }
    });
  } else if (clear) {
    document.getElementById('errorState').classList.remove('hidden');
  }

  App.isLoading = false;
  showLoader(false);
}

function retrySearch() {
  fetchVideos(App.currentSearch, true);
}

// ─────────────────────────────────────────────────────────
// RENDERIZAR CARD
// ─────────────────────────────────────────────────────────
function renderCard(v) {
  const item = {
    id: v.videoId,
    title: v.title || 'Sem título',
    thumb: v.thumbnail || v.image || '',
    artist: v.author?.name || 'YouTube',
    duration: v.timestamp || '--:--',
    ago: v.ago || '',
    views: v.views ? formatViews(v.views) : ''
  };
  App.videoPool.push(item);

  const el = document.createElement('div');
  el.className = 'cursor-pointer group thumb-hover fade-in';
  el.setAttribute('role', 'button');
  el.setAttribute('tabindex', '0');
  el.onclick = () => playVideo(item.id);
  el.onkeydown = e => { if (e.key === 'Enter') playVideo(item.id); };

  el.innerHTML = `
    <div class="relative rounded-xl overflow-hidden bg-zinc-900 border border-zinc-800/80
                group-hover:border-zinc-700 transition-all duration-200 shadow-lg"
         style="aspect-ratio:16/9">
      <img src="${safe(item.thumb)}"
           class="thumb-img w-full h-full object-cover"
           loading="lazy"
           decoding="async"
           onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22320%22 height=%22180%22%3E%3Crect fill=%22%23161616%22 width=%22320%22 height=%22180%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%23444%22 font-size=%2228%22%3E▶%3C/text%3E%3C/svg%3E'"
           alt="${safe(item.title)}">
      <div class="play-overlay absolute inset-0 bg-black/30 flex items-center justify-center">
        <div class="w-14 h-14 bg-red-700/90 rounded-full flex items-center justify-center shadow-xl">
          <i class="fa-solid fa-play text-white text-xl ml-1"></i>
        </div>
      </div>
      <span class="absolute bottom-2 right-2 bg-black/80 px-1.5 py-0.5 rounded text-[11px] font-bold tracking-wide backdrop-blur-sm">
        ${safe(item.duration)}
      </span>
    </div>
    <div class="flex gap-2.5 mt-2.5">
      <div class="w-8 h-8 rounded-full bg-zinc-800 border border-zinc-700 flex-shrink-0 overflow-hidden mt-0.5">
        <img src="https://api.dicebear.com/7.x/initials/svg?seed=${encodeURIComponent(item.artist)}&backgroundColor=9B111E&fontColor=ffffff"
             class="w-full h-full" alt="" loading="lazy">
      </div>
      <div class="min-w-0 flex-1">
        <h3 class="card-title font-semibold text-sm text-zinc-100 line-clamp-2 leading-snug">${safe(item.title)}</h3>
        <p class="text-zinc-500 text-xs mt-0.5 truncate">${safe(item.artist)}</p>
        <p class="text-zinc-600 text-xs">${item.views ? item.views + ' views' : ''}${item.ago && item.views ? ' • ' : ''}${safe(item.ago)}</p>
      </div>
    </div>`;

  document.getElementById('videoGrid').appendChild(el);
}

// ─────────────────────────────────────────────────────────
// PLAYER
// ─────────────────────────────────────────────────────────
function playVideo(id) {
  const video = App.videoPool.find(v => v.id === id)
             || App.history.find(v => v.id === id);
  if (!video) return;

  App.currentIndex = App.videoPool.findIndex(v => v.id === id);

  // Histórico
  App.history = App.history.filter(v => v.id !== id);
  App.history.unshift(video);
  try { localStorage.setItem('rubi_history', JSON.stringify(App.history.slice(0, 20))); } catch(e) {}
  if (App.isHome) renderHistory();

  openPlayerModal(id, video);
}

function openPlayerModal(id, video) {
  const wrapper = document.getElementById('playerWrapper');
  wrapper.classList.remove('hidden');
  wrapper.classList.add('flex');
  document.body.classList.add('modal-open');

  document.getElementById('playingTitle').textContent = video.title;
  document.getElementById('detailTitle').textContent = video.title;
  document.getElementById('detailAuthor').textContent = video.artist;
  document.getElementById('playPauseIcon').className = 'fa-solid fa-pause';
  App.isPlaying = true;
  updateNavBtns();
  renderUpNext();

  if (App.ytReady) {
    initYTPlayer(id);
  } else {
    // Fallback rápido com iframe
    document.getElementById('ytPlayer').innerHTML =
      `<iframe src="https://www.youtube.com/embed/${encodeURIComponent(id)}?autoplay=1&rel=0&modestbranding=1&playsinline=1"
               style="width:100%;height:100%;border:none;" allowfullscreen
               allow="autoplay; encrypted-media; fullscreen"></iframe>`;
    App.pendingVideoId = id;
  }
}

function initYTPlayer(id) {
  const playerVars = {
    autoplay: 1, playsinline: 1,
    modestbranding: 1, rel: 0,
    iv_load_policy: 3, controls: 1
  };

  if (App.player && typeof App.player.loadVideoById === 'function') {
    try { App.player.loadVideoById(id); return; } catch(e) { App.player = null; }
  }

  // Limpa container
  document.getElementById('ytPlayer').innerHTML = '';

  App.player = new window.YT.Player('ytPlayer', {
    height: '100%', width: '100%',
    videoId: id,
    playerVars,
    events: {
      onReady: e => { try { e.target.playVideo(); } catch(ex) {} },
      onStateChange: onStateChange,
      onError: () => { document.getElementById('playPauseIcon').className = 'fa-solid fa-play pl-1'; }
    }
  });
}

function onStateChange(event) {
  const icon = document.getElementById('playPauseIcon');
  switch (event.data) {
    case window.YT.PlayerState.PLAYING:
      App.isPlaying = true;
      icon.className = 'fa-solid fa-pause';
      break;
    case window.YT.PlayerState.PAUSED:
      App.isPlaying = false;
      icon.className = 'fa-solid fa-play pl-1';
      break;
    case window.YT.PlayerState.ENDED:
      playNext();
      break;
  }
}

function togglePlayState() {
  if (!App.player || typeof App.player.pauseVideo !== 'function') return;
  try {
    if (App.isPlaying) App.player.pauseVideo();
    else App.player.playVideo();
  } catch(e) {}
}

function closePlayer() {
  try { if (App.player?.stopVideo) App.player.stopVideo(); } catch(e) {}
  const wrapper = document.getElementById('playerWrapper');
  wrapper.classList.add('hidden');
  wrapper.classList.remove('flex');
  document.body.classList.remove('modal-open');
  App.isPlaying = false;
}

function playNext() {
  if (App.currentIndex < App.videoPool.length - 1) {
    App.currentIndex++;
    const v = App.videoPool[App.currentIndex];
    // Atualiza info sem fechar modal
    document.getElementById('playingTitle').textContent = v.title;
    document.getElementById('detailTitle').textContent = v.title;
    document.getElementById('detailAuthor').textContent = v.artist;
    updateNavBtns();
    renderUpNext();
    App.history = App.history.filter(h => h.id !== v.id);
    App.history.unshift(v);
    try { localStorage.setItem('rubi_history', JSON.stringify(App.history.slice(0,20))); } catch(e) {}
    if (App.ytReady) initYTPlayer(v.id);
  }
}

function playPrev() {
  if (App.currentIndex > 0) {
    App.currentIndex--;
    const v = App.videoPool[App.currentIndex];
    document.getElementById('playingTitle').textContent = v.title;
    document.getElementById('detailTitle').textContent = v.title;
    document.getElementById('detailAuthor').textContent = v.artist;
    updateNavBtns();
    renderUpNext();
    if (App.ytReady) initYTPlayer(v.id);
  }
}

function updateNavBtns() {
  document.getElementById('prevBtn').disabled = App.currentIndex <= 0;
  document.getElementById('nextBtn').disabled = App.currentIndex >= App.videoPool.length - 1;
}

// ─────────────────────────────────────────────────────────
// A SEGUIR
// ─────────────────────────────────────────────────────────
function renderUpNext() {
  const section = document.getElementById('upNextSection');
  const list = document.getElementById('upNextList');
  const upcoming = App.videoPool.slice(App.currentIndex + 1, App.currentIndex + 5);
  if (upcoming.length === 0) { section.classList.add('hidden'); return; }
  section.classList.remove('hidden');
  list.innerHTML = upcoming.map(v => `
    <div class="flex gap-3 cursor-pointer group p-2 rounded-lg hover:bg-zinc-900 transition-colors"
         onclick="playVideo('${safe(v.id)}')">
      <div class="relative flex-shrink-0 rounded-lg overflow-hidden bg-zinc-800" style="width:100px;aspect-ratio:16/9;">
        <img src="${safe(v.thumb)}" class="w-full h-full object-cover" loading="lazy" alt="">
        <span class="absolute bottom-1 right-1 bg-black/80 text-[10px] px-1 rounded font-bold">${safe(v.duration)}</span>
      </div>
      <div class="flex-1 min-w-0">
        <p class="text-xs font-semibold text-zinc-200 line-clamp-2 leading-snug group-hover:text-red-400 transition-colors">${safe(v.title)}</p>
        <p class="text-xs text-zinc-600 mt-1 truncate">${safe(v.artist)}</p>
      </div>
    </div>`).join('');
}

// ─────────────────────────────────────────────────────────
// HISTÓRICO
// ─────────────────────────────────────────────────────────
function renderHistory() {
  const section = document.getElementById('historySection');
  const grid = document.getElementById('historyGrid');
  if (!App.isHome || App.history.length === 0) {
    section.classList.add('hidden');
    return;
  }
  section.classList.remove('hidden');
  grid.innerHTML = App.history.map(v => `
    <div class="min-w-[130px] max-w-[130px] flex-shrink-0 snap-start cursor-pointer group"
         onclick="playVideo('${safe(v.id)}')">
      <div class="relative rounded-lg overflow-hidden border border-zinc-800 group-hover:border-zinc-600 transition-colors"
           style="aspect-ratio:16/9;">
        <img src="${safe(v.thumb)}" class="w-full h-full object-cover opacity-75 group-hover:opacity-100 transition-opacity" loading="lazy" alt="">
        <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
          <i class="fa-solid fa-play text-white text-lg"></i>
        </div>
      </div>
      <p class="text-[11px] mt-1.5 line-clamp-2 font-medium text-zinc-400 group-hover:text-white transition-colors leading-snug">${safe(v.title)}</p>
    </div>`).join('');
}

// ─────────────────────────────────────────────────────────
// UTILITÁRIOS
// ─────────────────────────────────────────────────────────
function handleSearch(e) {
  e.preventDefault();
  const q = document.getElementById('searchInput').value.trim();
  if (!q) return;
  App.isHome = false;
  document.getElementById('historySection').classList.add('hidden');
  fetchVideos(q, true);
  document.getElementById('searchInput').blur();
}

function goHome() {
  document.getElementById('searchInput').value = '';
  App.isHome = true;
  App.currentSearch = 'Lançamentos Musicais 2026';
  renderHistory();
  fetchVideos(App.currentSearch, true);
}

function handleInfiniteScroll() {
  const bottom = window.innerHeight + window.scrollY >= document.body.offsetHeight - 700;
  if (bottom && !App.isLoading) fetchVideos(App.currentSearch, false);
}

function showLoader(on) {
  document.getElementById('loaderScroll').style.opacity = on ? '1' : '0';
}

function formatViews(n) {
  if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
  return n;
}

function safe(str) {
  return String(str || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
</script>
