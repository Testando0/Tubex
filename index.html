<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050505">
    <link rel="manifest" href="/manifest.json">
    <title>RUBITUBE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/src/style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ruby: '#9B111E',
                        darkBg: '#050505',
                        darkCard: '#121212'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-white font-sans antialiased overflow-x-hidden selection:bg-ruby selection:text-white">

    <nav class="fixed top-0 w-full bg-darkBg/95 backdrop-blur-md z-[3000] flex items-center justify-between px-4 lg:px-6 h-16 border-b border-zinc-900 shadow-lg">
        <div class="flex items-center gap-3 cursor-pointer group" id="btnHome">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-ruby to-red-900 flex items-center justify-center shadow-[0_0_15px_rgba(155,17,30,0.4)] group-hover:scale-105 transition-transform">
                <i class="fa-solid fa-play text-white text-xs"></i>
            </div>
            <span class="text-xl font-black tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-white to-zinc-400">RUBITUBE</span>
        </div>
        
        <div class="flex-1 max-w-[500px] mx-4 hidden sm:block">
            <form id="searchForm" class="flex bg-darkCard border border-zinc-800 rounded-full overflow-hidden focus-within:border-ruby transition-colors shadow-inner">
                <input id="searchInput" type="text" placeholder="Pesquisar no Rubitube..." class="bg-transparent w-full outline-none text-sm text-white px-5 py-2.5">
                <button type="submit" class="px-5 bg-zinc-900/50 text-zinc-400 hover:text-ruby transition-colors border-l border-zinc-800">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </form>
        </div>

        <div class="flex items-center gap-4">
            <button class="sm:hidden text-zinc-400 hover:text-ruby" id="btnMobileSearch"><i class="fa-solid fa-magnifying-glass"></i></button>
            <div id="avatar" class="w-8 h-8 rounded-full border-2 border-ruby bg-cover bg-center cursor-pointer"></div>
        </div>
    </nav>

    <main class="pt-24 pb-20 px-4 lg:px-8 max-w-[2000px] mx-auto min-h-screen">
        
        <section id="historySection" class="hidden mb-10 fade-in">
            <div class="flex items-center gap-2 mb-4">
                <i class="fa-solid fa-clock-rotate-left text-ruby"></i>
                <h2 class="text-sm font-bold text-zinc-300 uppercase tracking-widest">Continue Assistindo</h2>
            </div>
            <div id="historyGrid" class="flex gap-4 overflow-x-auto no-scrollbar pb-4 snap-x"></div>
        </section>

        <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-x-4 gap-y-8"></div>
        
        <div id="loaderScroll" class="py-10 flex justify-center opacity-0 transition-opacity">
            <div class="w-8 h-8 border-4 border-ruby border-t-transparent rounded-full animate-spin shadow-[0_0_15px_rgba(155,17,30,0.5)]"></div>
        </div>
    </main>

    <div id="playerWrapper" class="fixed inset-0 z-[5000] bg-black hidden backdrop-blur-sm">
        <div class="relative w-full h-full flex flex-col justify-center items-center">
            
            <div class="absolute top-0 left-0 w-full p-4 flex justify-between items-center z-[6000] bg-gradient-to-b from-black/80 to-transparent">
                <button id="btnClosePlayer" class="w-10 h-10 bg-zinc-900/80 hover:bg-ruby rounded-full text-white flex items-center justify-center transition-colors">
                    <i class="fa-solid fa-chevron-down"></i>
                </button>
            </div>

            <div class="w-full max-w-6xl aspect-video bg-black shadow-2xl relative group">
                <div id="ytPlayer" class="w-full h-full pointer-events-none"></div>
                
                <div id="playerOverlay" class="absolute inset-0 z-[5500] cursor-pointer flex items-center justify-center gap-8 opacity-0 group-hover:opacity-100 transition-opacity bg-black/40">
                    <button class="control-btn" data-action="prev"><i class="fa-solid fa-backward-step"></i></button>
                    <button class="control-btn w-16 h-16 text-2xl bg-ruby/80 border-ruby" data-action="togglePlay"><i class="fa-solid fa-pause" id="playPauseIcon"></i></button>
                    <button class="control-btn" data-action="next"><i class="fa-solid fa-forward-step"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
