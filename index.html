<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Clone Pro - 100% Funcional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f0f0f; color: white; scroll-behavior: smooth; }
        .yt-red { color: #ff0000; }
        .video-card:hover { transform: translateY(-5px); }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        #loading { display: none; }
    </style>
</head>
<body class="antialiased">

    <nav class="fixed top-0 w-full bg-[#0f0f0f]/95 backdrop-blur-sm z-50 flex items-center justify-between px-4 h-16 border-b border-zinc-800">
        <div class="flex items-center gap-4">
            <i class="fa-solid fa-bars text-xl p-2 cursor-pointer hover:bg-zinc-800 rounded-full"></i>
            <div class="flex items-center gap-1 cursor-pointer" onclick="location.reload()">
                <i class="fa-brands fa-youtube text-3xl yt-red"></i>
                <span class="text-xl font-bold tracking-tighter">YouTube</span>
            </div>
        </div>

        <div class="flex items-center flex-1 max-w-[720px] mx-10">
            <div class="flex w-full bg-zinc-900 border border-zinc-800 rounded-full items-center px-4 py-2 shadow-inner focus-within:border-blue-500 transition-all">
                <input id="searchInput" type="text" placeholder="Pesquisar vídeo..." class="bg-transparent w-full outline-none text-zinc-200">
                <button id="searchBtn" class="pl-4 text-zinc-400 hover:text-white border-l border-zinc-700 ml-2">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <i class="fa-solid fa-video p-2 hover:bg-zinc-800 rounded-full cursor-pointer hidden md:block"></i>
            <div class="w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center text-sm font-bold">G</div>
        </div>
    </nav>

    <div class="flex pt-16">
        <aside class="hidden lg:block w-64 fixed left-0 h-screen p-4 space-y-2 border-r border-zinc-800">
            <div class="flex items-center gap-5 p-3 rounded-xl bg-zinc-800 cursor-pointer">
                <i class="fa-solid fa-house"></i> <span class="font-medium">Início</span>
            </div>
            <div class="flex items-center gap-5 p-3 rounded-xl hover:bg-zinc-800 cursor-pointer text-zinc-400 hover:text-white">
                <i class="fa-solid fa-bolt"></i> <span class="font-medium">Shorts</span>
            </div>
            <div class="flex items-center gap-5 p-3 rounded-xl hover:bg-zinc-800 cursor-pointer text-zinc-400 hover:text-white">
                <i class="fa-solid fa-clapperboard"></i> <span class="font-medium">Inscrições</span>
            </div>
        </aside>

        <main class="lg:ml-64 w-full p-6">
            
            <div id="loading" class="text-center py-10">
                <div class="inline-block w-8 h-8 border-4 border-zinc-500 border-t-red-600 rounded-full animate-spin"></div>
                <p class="mt-2 text-zinc-400 text-sm">A procurar na API...</p>
            </div>

            <div id="playerSection" class="hidden mb-12">
                <div class="grid grid-cols-1 xl:grid-cols-3 gap-8">
                    <div class="xl:col-span-2">
                        <div class="aspect-video w-full bg-black rounded-2xl overflow-hidden shadow-2xl border border-zinc-800">
                            <iframe id="videoPlayer" class="w-full h-full" src="" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
                        </div>
                        <div class="mt-5">
                            <h1 id="videoTitle" class="text-2xl font-bold line-clamp-2"></h1>
                            <div class="flex flex-wrap items-center justify-between mt-4 gap-4">
                                <div class="flex items-center gap-3">
                                    <div class="w-12 h-12 bg-zinc-800 rounded-full flex items-center justify-center">
                                        <i class="fa-solid fa-user text-zinc-600"></i>
                                    </div>
                                    <div>
                                        <p id="authorName" class="font-bold"></p>
                                        <p class="text-xs text-zinc-400">Verificado pela API</p>
                                    </div>
                                    <button class="bg-white text-black px-6 py-2 rounded-full font-bold text-sm ml-4 hover:bg-zinc-200 transition-colors">Subscrever</button>
                                </div>
                                <div class="flex gap-2 bg-zinc-800 p-1 rounded-full">
                                    <button class="flex items-center gap-2 px-4 py-2 hover:bg-zinc-700 rounded-l-full border-r border-zinc-700"><i class="fa-solid fa-thumbs-up"></i> Gostei</button>
                                    <button class="px-4 py-2 hover:bg-zinc-700 rounded-r-full"><i class="fa-solid fa-thumbs-down"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div id="recommendations" class="space-y-4">
                        <p class="text-sm font-bold text-zinc-400 uppercase tracking-wider">Histórico de Pesquisa</p>
                        <div id="historyList" class="space-y-4"></div>
                    </div>
                </div>
            </div>

            <div id="welcome" class="text-center py-20">
                <i class="fa-brands fa-youtube text-8xl text-zinc-800 mb-6"></i>
                <h2 class="text-2xl font-bold">O que queres ver hoje?</h2>
                <p class="text-zinc-500 mt-2">Pesquisa por músicas ou vídeos usando a barra acima.</p>
            </div>

            <div id="videoGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-6"></div>
        </main>
    </div>

    <script>
        // Usamos um Proxy se a API bloquear CORS direto
        const API_BASE = "https://api.vreden.my.id/api/v1/download/play/video?query=";

        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const loading = document.getElementById('loading');
        const welcome = document.getElementById('welcome');
        const playerSection = document.getElementById('playerSection');
        const videoGrid = document.getElementById('videoGrid');

        async function performSearch() {
            const query = searchInput.value.trim();
            if (!query) return;

            // UI Feedback
            loading.style.display = 'block';
            welcome.style.display = 'none';

            try {
                // Chamada à API
                const response = await fetch(API_BASE + encodeURIComponent(query));
                
                if (!response.ok) throw new Error("Erro na API");
                
                const data = await response.json();

                if (data.status && data.result.metadata) {
                    displayVideo(data.result.metadata);
                } else {
                    alert("Vídeo não encontrado.");
                }
            } catch (error) {
                console.error("Erro detalhado:", error);
                alert("Erro ao conectar à API. Verifica a ligação ou tenta novamente.");
            } finally {
                loading.style.display = 'none';
            }
        }

        function displayVideo(meta) {
            // Atualiza o Player Principal
            document.getElementById('videoPlayer').src = `https://www.youtube.com/embed/${meta.videoId}?autoplay=1`;
            document.getElementById('videoTitle').innerText = meta.title;
            document.getElementById('authorName').innerText = meta.author.name;
            
            playerSection.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });

            // Adiciona Card à Grid
            const card = `
                <div class="video-card cursor-pointer transition-all duration-300" onclick="playAgain('${meta.videoId}', '${meta.title.replace(/'/g, "&apos;")}', '${meta.author.name}')">
                    <div class="relative rounded-2xl overflow-hidden aspect-video bg-zinc-800 mb-3">
                        <img src="${meta.image}" class="w-full h-full object-cover">
                        <span class="absolute bottom-2 right-2 bg-black/90 px-2 py-0.5 rounded text-[10px] font-bold">${meta.timestamp}</span>
                    </div>
                    <div class="flex gap-3">
                        <div class="w-9 h-9 bg-zinc-800 rounded-full flex-shrink-0 flex items-center justify-center">
                            <i class="fa-solid fa-play text-[10px] text-zinc-500"></i>
                        </div>
                        <div>
                            <h3 class="font-bold text-sm leading-snug line-clamp-2">${meta.title}</h3>
                            <p class="text-zinc-400 text-xs mt-1">${meta.author.name}</p>
                            <p class="text-zinc-500 text-[11px]">${meta.views.toLocaleString()} visualizações • ${meta.ago}</p>
                        </div>
                    </div>
                </div>
            `;
            videoGrid.insertAdjacentHTML('afterbegin', card);
        }

        function playAgain(id, title, author) {
            document.getElementById('videoPlayer').src = `https://www.youtube.com/embed/${id}?autoplay=1`;
            document.getElementById('videoTitle').innerText = title;
            document.getElementById('authorName').innerText = author;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Eventos
        searchBtn.addEventListener('click', performSearch);
        
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });
    </script>
</body>
</html>
